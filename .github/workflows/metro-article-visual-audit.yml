name: Metro story 7-image semantic audit (CPU only)
on:
  push:
    branches: [experiment/editorial-image-rerank-20261123]
    paths: [.github/workflows/metro-article-visual-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the original owner-readable mystery article (not regenerated)
        run: |
          mkdir -p metro-audit-download metro-audit-source
          gh run download 45027517283 --repo "${{ github.repository }}" -n zen-mystery-owner-readable -D metro-audit-download
          find metro-audit-download -maxdepth 2 -type f
          unzip -o metro-audit-download/owner-review-readable.zip -d metro-audit-source
          test -f metro-audit-source/final.md
          test -f metro-audit-source/image-manifest.json
          test -f metro-audit-source/images/07-morning.jpg
      - name: Install CPU visual models
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'transformers==5.24.0' 'sentencepiece>=0.2'
      - name: Audit seven original images against seven story sections
        timeout-minutes: 36
        run: python -m research.metro_article_visual_audit
      - name: Save model results and comparative contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-7-images-three-models
          path: metro-audit-results/
          if-no-files-found: warn
          retention-days: 7
