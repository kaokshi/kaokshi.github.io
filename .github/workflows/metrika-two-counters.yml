name: Verify ZEN Cinema and Science
on:
  push:
    branches: [assistant/zen-control-statistics-20261124]
    paths: ['.github/workflows/metrika-two-counters.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check both counters and traffic
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          token=os.environ.get("YANDEX_METRIKA_TOKEN","").strip()
          if not token: raise SystemExit("TOKEN_MISSING")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def get(label,path,params={}):
              url="https://api-metrika.yandex.net"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              try:
                  with opener.open(urllib.request.Request(url,headers={"Authorization":"OAuth "+token,"Accept":"application/json"}),timeout=20) as r:
                      print(label+"_HTTP="+str(r.status))
                      return json.load(r)
              except urllib.error.HTTPError as e: print(label+"_HTTP="+str(e.code))
              except Exception: print(label+"_CONNECTION_FAILED")
              return None
          listing=get("LIST","/management/v1/counters",{"per_page":100})
          if not isinstance(listing,dict): raise SystemExit(1)
          science=[str(c.get("id")) for c in listing.get("counters",[]) if str(c.get("name","")).strip().casefold()=="zen science" and str(c.get("id","")).isdigit()]
          print("SCIENCE_MATCHES="+str(len(science)))
          targets={"CINEMA":"114654979"}
          if len(science)==1 and science[0]!=targets["CINEMA"]: targets["SCIENCE"]=science[0]
          failed=len(targets)!=2
          for label,cid in targets.items():
              print(label+"_ID="+cid)
              counter=get(label+"_COUNTER","/management/v1/counter/"+cid)
              report=get(label+"_REPORT","/stat/v1/data",{"ids":cid,"metrics":"ym:s:visits,ym:s:pageviews","date1":"7daysAgo","date2":"today","accuracy":"full"})
              ok=isinstance(counter,dict) and str(counter.get("counter",{}).get("id"))==cid and isinstance(report,dict) and isinstance(report.get("totals"),list) and len(report["totals"])==2
              print(label+"_VERIFIED="+str(ok).lower())
              if ok: print(label+"_TRAFFIC_PRESENT="+str(any(x>0 for x in report["totals"] if isinstance(x,(int,float)))).lower())
              failed=failed or not ok
          raise SystemExit(int(failed))
          PY
