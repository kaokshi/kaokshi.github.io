name: Editorial AI checks (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-ai-checks.yml'
      - 'content/articles/**'
  workflow_dispatch:
    inputs:
      slug:
        description: "Existing article slug; leave empty to check all articles"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: editorial-ai-checks
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install free open-source text tools
        run: python -m pip install -r requirements-editorial.txt
      - name: Download published open models to runner cache
        run: |
          aiw-ru models install modernbert lightgbm
      - name: Install pinned ruBERT v4 in isolated environment
        run: |
          git clone --quiet https://github.com/k1y0miiii/ru-ai-text-detector.git .rubert-upstream
          git -C .rubert-upstream checkout --quiet 244e955427548f5856bb389cc8611f959911290c
          python -m venv .rubert-venv
          .rubert-venv/bin/python -m pip install --upgrade pip
          .rubert-venv/bin/python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          .rubert-venv/bin/python -m pip install "transformers==4.44.2" "scikit-learn==1.5.2" "numpy==1.26.4" "joblib==1.4.2" "huggingface_hub==0.26.5"
      - name: Download pinned ruBERT v4 calibration and weights
        run: |
          .rubert-venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "k1y0mi/ru-ai-text-detector",
              repo_type="model",
              revision="175e75ec79e9471f3f5b4ab0da9b859188446807",
              allow_patterns=["v4_model/*", "v4_calibrator.joblib", "threshold_v4.json"],
              local_dir=".rubert-upstream/models",
          )
          PY
      - name: Run primary ruBERT and three comparisons (only changed articles on push)
        env:
          ARTICLE_SLUG: ${{ inputs.slug }}
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA" -- 'content/articles/*.json' > /tmp/changed-editorial-articles.txt
            if [ -s /tmp/changed-editorial-articles.txt ]; then
              while IFS= read -r filename; do
                slug="$(basename "$filename" .json)"
                python src/editorial_ai_check.py --slug "$slug"
              done < /tmp/changed-editorial-articles.txt
            else
              # Workflow-only changes: regression test the existing film pilot; never edit it.
              python src/editorial_ai_check.py --slug cinema-01-truman-show-real-photos
            fi
          elif [ -n "$ARTICLE_SLUG" ]; then
            python src/editorial_ai_check.py --slug "$ARTICLE_SLUG"
          else
            python src/editorial_ai_check.py
          fi
      - name: Print numeric results for the trial article
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("editorial-check-reports").glob("*.json")):
              if p.name == "index.json":
                  continue
              d=json.loads(p.read_text(encoding="utf-8"))
              print("REPORT_JSON_START", p.name)
              print(json.dumps({"slug":d.get("article_slug"),"characters_without_spaces":d.get("characters_without_spaces"),"checks":d.get("checks"),"editorial_threshold":d.get("editorial_threshold")},ensure_ascii=False))
              print("REPORT_JSON_END")
          PY
      - name: Preserve review report (never publish to site)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-ai-review
          path: editorial-check-reports/
          if-no-files-found: warn
          retention-days: 7
