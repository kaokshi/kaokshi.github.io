name: Strict four-model Klein loop real isolation (free-only)
on:
  push:
    branches: [experiment/editorial-image-strict-20261123]
    paths: [.github/workflows/strict-klein-real-loop.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDITORIAL_CF_FREE_ONLY: 'true'
      EDITORIAL_IMAGE_FEEDBACK_EXPERIMENT: 'true'
      EDITORIAL_OBJECT_DETECTION_EXPERIMENT: 'true'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free CPU visual tools
        timeout-minutes: 20
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2' 'transformers==5.24.0' 'timm>=1.0,<2' 'sentencepiece>=0.2,<0.3'
      - name: Run at most three Klein attempts and four image reviewers
        timeout-minutes: 38
        run: python -m research.metro_strict_full_klein_trial
      - name: Preserve owner-only draft candidates and evidence, never release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-strict-four-model-klein-results
          path: metro-strict-full-trial/
          retention-days: 2
          if-no-files-found: warn
