name: Strict visual constraint regression (no image API)
# Includes best-of-three owner-review hold regression and confirmed evidence bypass.
on:
  push:
    branches: [experiment/editorial-image-strict-20261123]
    paths: [.github/workflows/strict-image-constraints.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local fixtures
        run: python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2'
      - name: Test strict objects, counts, retries, source selection
        run: python -m unittest -v tests.test_editorial_visual_constraints tests.test_editorial_image_feedback tests.test_editorial_image_reranking tests.test_editorial_object_detector
