name: Isolated cinema sources smoke
on:
  push:
    branches: [diagnostics/cinema-three-sources-20261125]
    paths: ['.github/workflows/cinema-three-sources-smoke.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install image verifier
        run: |
          python3 -m pip install --quiet Pillow 'mcp>=1.12,<2' imageio-ffmpeg
          python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_version())'
      - name: Diagnose OutNow only
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,hashlib,subprocess,tempfile,pathlib,re,asyncio,imageio_ffmpeg
          from PIL import Image
          from io import BytesIO
          def get(url, headers=None, data=None, cap=2_000_000):
              req=urllib.request.Request(url,data=data,headers={'User-Agent':'ZEN-Control-source-diagnostic/1.0',**(headers or {})})
              with urllib.request.urlopen(req,timeout=25) as r:
                  b=r.read(cap+1)
                  if len(b)>cap: raise ValueError('response_size_limit')
                  return b,dict(r.headers)
          def jget(url,headers=None):
              return json.loads(get(url,headers)[0])
          failed=[]
          def check(name,fn):
              try: fn(); print(name+'_PASS',flush=True)
              except Exception as e:
                  print(name+'_FAIL',type(e).__name__,getattr(e,'code',''),flush=True); failed.append(name)
          def outnow():
              from mcp import ClientSession
              from mcp.client.streamable_http import streamablehttp_client
              import traceback
              async def probe():
                  async with streamablehttp_client('https://outnow.ch/mcp') as (read,write,_):
                      async with ClientSession(read,write) as session:
                          await session.initialize()
                          tools=(await session.list_tools()).tools
                          t=next(t for t in tools if t.name=='search_content')
                          print('OUTNOW_SCHEMA',json.dumps(t.inputSchema,ensure_ascii=True),flush=True)
                          for query in ('Dune: Part Two','Dune'):
                              try:
                                  result=await session.call_tool(t.name,{'query':query,'language':'en','type':'title'})
                                  payload=result.model_dump(mode='json')
                                  print('OUTNOW_RESULT',query,'ERROR',result.isError,json.dumps(payload,ensure_ascii=True)[:3500],flush=True)
                                  if not result.isError and re.search('dune',json.dumps(payload),re.I):return
                              except Exception as e:
                                  print('OUTNOW_CALL_EXCEPTION',type(e).__name__,str(e)[:1000],flush=True)
                                  traceback.print_exception(e)
                          raise ValueError('search_no_matching_result')
              try: asyncio.run(asyncio.wait_for(probe(),timeout=90))
              except Exception as e:
                  traceback.print_exception(e)
                  raise
          def tmdb():
              token=os.environ.get('TMDB_API_TOKEN','').strip()
              assert token,'missing_secret'
              h={'Accept':'application/json'}
              short=bool(re.fullmatch(r'[a-fA-F0-9]{32}',token))
              if not short: h['Authorization']='Bearer '+token
              print('TMDB_AUTH_MODE','api_key' if short else 'bearer',flush=True)
              base='https://api.themoviedb.org/3'
              def api(endpoint,params=None):
                  q=dict(params or {})
                  if short:q['api_key']=token
                  return jget(base+endpoint+('?' + urllib.parse.urlencode(q) if q else ''),h)
              results=api('/search/movie',{'query':'Dune: Part Two','year':2024})['results']
              movie=next(x for x in results if x['original_title']=='Dune: Part Two' and x['release_date'].startswith('2024'))
              imgs=api('/movie/'+str(movie['id'])+'/images')
              candidates=[x for x in imgs['backdrops'] if x.get('iso_639_1') is None and x['width']>=1280]
              print('TMDB_MATCH',movie['id'],'BACKDROPS',len(imgs['backdrops']),'CANDIDATES',len(candidates),flush=True)
              assert len(candidates)>=7
              path=candidates[0]['file_path']
              assert re.fullmatch(r'/[A-Za-z0-9]+\.(jpg|png)',path)
              raw,_=get('https://image.tmdb.org/t/p/w1280'+path,cap=8_000_000)
              with Image.open(BytesIO(raw)) as im: print('TMDB_IMAGE',im.format,im.size,flush=True); im.verify()
          def blender():
              title='File:WING IT! - Blender Open Movie-full movie.webm'
              q=urllib.parse.urlencode({'action':'query','format':'json','titles':title,'prop':'imageinfo','iiprop':'url|size|extmetadata'})
              p=next(iter(jget('https://commons.wikimedia.org/w/api.php?'+q)['query']['pages'].values()))
              i=p['imageinfo'][0]; license=i['extmetadata']['LicenseShortName']['value']
              assert license.startswith('CC BY') and i['size']<50_000_000 and i['url'].startswith('https://upload.wikimedia.org/')
              raw,_=get(i['url'],cap=50_000_000)
              print('BLENDER_LICENSE',license,'VIDEO_BYTES',len(raw),flush=True)
              with tempfile.TemporaryDirectory() as tmp:
                  d=pathlib.Path(tmp); video=d/'film.webm'; video.write_bytes(raw)
                  hashes=set()
                  for t in (15,40,65,90,115,140,165):
                      dest=d/f'{t}.jpg'
                      subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-v','error','-ss',str(t),'-i',str(video),'-frames:v','1','-vf','scale=1280:-1','-y',str(dest)],check=True,timeout=20)
                      with Image.open(dest) as im: im.verify()
                      hashes.add(hashlib.sha256(dest.read_bytes()).hexdigest())
                  print('BLENDER_DISTINCT_SHA256',len(hashes),flush=True); assert len(hashes)==7
          check('OUTNOW',outnow)
          print('FAILED_SOURCES',','.join(failed),flush=True)
          raise SystemExit(bool(failed))
          PY
