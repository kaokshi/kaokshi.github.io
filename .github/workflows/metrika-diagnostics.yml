name: Metrika read-only diagnostics
on:
  push:
    branches: [assistant/zen-control-statistics-20261124]
    paths: ['.github/workflows/metrika-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare management and reporting permissions
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          token=os.environ.get("YANDEX_METRIKA_TOKEN","").strip()
          if not token: raise SystemExit("TOKEN_MISSING")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          known={"access_denied","forbidden","invalid_token","invalid_oauth_token","unauthorized","permission_denied","insufficient_scope","not_found","invalid_parameter","invalid_request","quota_exceeded","oauth_token_invalid","oauth_token_expired","access_denied_error","invalid_token_error","not_found_error","authorization_error"}
          def get(label,path,params={}):
              url="https://api-metrika.yandex.net"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"Authorization":"OAuth "+token,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=20) as r:
                      print(label+"_HTTP="+str(r.status))
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print(label+"_HTTP="+str(e.code))
                  try:
                      data=json.loads(e.read(8192))
                      codes=[data.get("error"),data.get("error_type")]+[x.get("error_type") for x in data.get("errors",[]) if isinstance(x,dict)]
                      print(label+"_ERROR_TYPE="+",".join(sorted(set(x for x in codes if isinstance(x,str) and x in known))) if any(isinstance(x,str) and x in known for x in codes) else label+"_ERROR_TYPE=unclassified")
                  except Exception: print(label+"_ERROR_TYPE=non_json")
              except Exception: print(label+"_CONNECTION_FAILED")
              return None
          listing=get("COUNTERS","/management/v1/counters",{"per_page":100})
          if isinstance(listing,dict):
              rows=listing.get("counters",[])
              print("TARGET_IN_VISIBLE_LIST="+str(any(str(x.get("id"))=="114654979" for x in rows if isinstance(x,dict))).lower())
              print("VISIBLE_COUNTERS_PRESENT="+str(bool(rows)).lower())
          counter=get("COUNTER","/management/v1/counter/114654979")
          report=get("REPORT","/stat/v1/data",{"ids":"114654979","metrics":"ym:s:visits","date1":"7daysAgo","date2":"yesterday","accuracy":"full"})
          if isinstance(report,dict): print("REPORT_SCHEMA_OK="+str(isinstance(report.get("totals"),list)).lower())
          PY
