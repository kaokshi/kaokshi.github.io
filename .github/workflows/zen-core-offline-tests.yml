name: ZEN CORE offline tests
on:
  push:
    branches: [assistant/zen-core-dry-run-adapter-20261124]
    paths: ['telegram-control/**', '.github/workflows/zen-core-offline-tests.yml']
  pull_request:
    branches: [feature/telegram-control-mvp]
    paths: ['telegram-control/**', '.github/workflows/zen-core-offline-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test telegram-control/worker.test.mjs telegram-control/adapter.test.mjs
