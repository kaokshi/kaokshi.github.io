name: ZEN CORE offline tests
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['telegram-control/**', 'src/**', 'tests/**', 'config/zen_core.json', '.github/workflows/zen-core-offline-tests.yml']
  pull_request:
    branches: [feature/telegram-control-mvp]
    paths: ['telegram-control/**', '.github/workflows/zen-core-offline-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test telegram-control/worker.test.mjs telegram-control/adapter.test.mjs telegram-control/spend-simulation.test.mjs telegram-control/intake.test.mjs telegram-control/receipt.test.mjs telegram-control/notifications.test.mjs telegram-control/recovery.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify merged executor intake and receipt contract
        run: |
          node --input-type=module -e 'import {intakeView} from "./telegram-control/intake.mjs"; const j={id:"agent:fixture",status:"blocked_prelaunch",executed:false,publicationAuthorized:false,preview:{mode:"dry_run",executorMode:"semi_autonomous"},plan:{items:[{channel:"legends",count:2},{channel:"science",count:1}],day:"2026-11-25",instructions:"Synthetic fixture"},releaseAt:1795597200000}; const storage={get:async k=>k==="production:job:"+j.id?j:null,transaction:async f=>f(storage)};const r=await intakeView(storage,j.id);if(r.status!==200)process.exit(1);console.log(JSON.stringify(r.body))' > "${RUNNER_TEMP}/intake-fixture.json"
          python telegram-control/intake_contract_test.py . "${RUNNER_TEMP}/intake-fixture.json"
      - name: Run executor offline regression suite
        run: python -m unittest tests.test_editorial_routerai_adapter tests.test_editorial_routerai_two_articles tests.test_editorial_zen_core tests.test_editorial_zen_executor -q
