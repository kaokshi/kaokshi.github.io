name: ZEN CORE offline tests
on:
  push:
    branches: [assistant/zen-core-dry-run-adapter-20261124]
    paths: ['telegram-control/**', '.github/workflows/zen-core-offline-tests.yml']
  pull_request:
    branches: [feature/telegram-control-mvp]
    paths: ['telegram-control/**', '.github/workflows/zen-core-offline-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test telegram-control/worker.test.mjs telegram-control/adapter.test.mjs telegram-control/spend-simulation.test.mjs telegram-control/intake.test.mjs telegram-control/receipt.test.mjs telegram-control/notifications.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: ffc9f82f8afd7841cdea7d80efdf63247ca8d6cd
          path: executor-contract
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual PR85 intake contract with synthetic Worker envelope
        run: |
          node --input-type=module -e 'import {intakeView} from "./telegram-control/intake.mjs"; const j={id:"agent:fixture",status:"blocked_prelaunch",executed:false,publicationAuthorized:false,preview:{mode:"dry_run"},plan:{items:[{channel:"legends",count:2},{channel:"science",count:1}],day:"2026-11-25",instructions:"Synthetic fixture"},releaseAt:1795597200000}; const storage={get:async k=>k==="production:job:"+j.id?j:null,transaction:async f=>f(storage)};const r=await intakeView(storage,j.id);if(r.status!==200)process.exit(1);console.log(JSON.stringify(r.body))' > "${RUNNER_TEMP}/intake-fixture.json"
          python telegram-control/intake_contract_test.py executor-contract "${RUNNER_TEMP}/intake-fixture.json"
