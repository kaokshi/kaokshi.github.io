name: Audit Russian cinema human AI genre corpus (research only)
on:
  push:
    branches: [main]
    paths:
      - 'src/editorial_cinema_corpus.py'
      - '.github/workflows/editorial-cinema-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install provenance-reading dataset package
        run: python -m pip install datasets==3.6.0
      - name: Audit film corpus and inspect actual genre subsets
        run: python src/editorial_cinema_corpus.py
      - name: Archive film genre corpus metadata, never source texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-genre-research-corpus-manifest
          path: editorial-cinema-corpus-audit/cinema-corpus-manifest.json
          if-no-files-found: warn
          retention-days: 30
