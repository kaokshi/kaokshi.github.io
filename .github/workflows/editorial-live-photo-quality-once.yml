name: One-time real photo scene QA (no generative API)
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-live-photo-quality-once.yml
permissions:
  contents: read
jobs:
  real-photo-match:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU visual matching dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'transformers==5.24.0' 'pillow>=11,<13' 'ImageHash>=4.3,<5'
      - name: Compare actual science and cinema pixels against their scene prompts
        timeout-minutes: 12
        run: python -m src.editorial_live_photo_validation
