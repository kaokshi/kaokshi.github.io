name: Science source fallback offline regression
on:
  push:
    branches:
      - fix/editorial-qwen-revision-target-20261121
    paths:
      - src/editorial_pubmed.py
      - src/editorial_research.py
      - src/editorial_pipeline.py
      - tests/test_editorial_pubmed_fallback.py
      - .github/workflows/editorial-science-fallback-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PubMed extraction and outage recovery without network
        run: python -m unittest discover -s tests -p 'test_editorial_pubmed_fallback.py' -v
