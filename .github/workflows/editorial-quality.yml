name: Editorial quality (three channels, read-only)
on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'content/assets/**'
      - 'src/editorial_quality.py'
      - 'src/editorial_export_md.py'
      - 'src/editorial_language_tool.py'
      - 'src/rss_verify.py'
      - 'requirements-quality.txt'
      - '.vale.ini'
      - 'editorial-styles/**'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional article slug for focused review"
        required: false
        type: string
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free quality tools
        run: python -m pip install -r requirements-quality.txt
      - name: Channel-specific quality, image duplicates, internal similarity
        env:
          ARTICLE_SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$ARTICLE_SLUG" ]; then
            python src/editorial_quality.py --slug "$ARTICLE_SLUG"
          else
            python src/editorial_quality.py
          fi
      - name: Export texts for local Vale review
        run: python src/editorial_export_md.py
      - name: Install Vale 3.13.0
        id: vale_install
        continue-on-error: true
        run: |
          curl -fL --retry 2 -o /tmp/vale.tgz https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          mkdir -p /tmp/vale
          tar xzf /tmp/vale.tgz -C /tmp/vale vale
          sudo install /tmp/vale/vale /usr/local/bin/vale
      - name: Vale Russian style rules
        if: steps.vale_install.outcome == 'success'
        continue-on-error: true
        run: vale --output=JSON editorial-quality-reports/vale-input/ > editorial-quality-reports/vale.json
      - name: Check cited web links with Lychee
        if: hashFiles('editorial-quality-reports/links.txt') != ''
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--no-progress --max-concurrency 3 --timeout 20 editorial-quality-reports/links.txt'
          output: editorial-quality-reports/lychee.md
          fail: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Local Russian grammar for all edited articles (and three channel smoke tests)
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          args=()
          if [ -n "$REQUESTED_SLUG" ]; then
            args+=(--slug "$REQUESTED_SLUG")
          elif [ "$EVENT_NAME" = "push" ]; then
            while IFS= read -r filename; do
              slug="$(basename "$filename" .json)"
              args+=(--slug "$slug")
            done < <(git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA" -- 'content/articles/*.json')
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            for slug in legends-pilot-midnight-bus-20261120 legends-pilot-photo-studio-20261120 science-pilot-noctilucent-clouds-20261120 science-pilot-hair-ice-20261120 cinema-pilot-inception-20261120 cinema-pilot-shutter-island-20261120; do
              args+=(--slug "$slug")
            done
          fi
          failures=0
          for ((i=0; i<${#args[@]}; i+=2)); do
            slug="${args[i+1]}"
            if ! python src/editorial_language_tool.py --slug "$slug" --output "editorial-quality-reports/languagetool-$slug.json"; then
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "LanguageTool incomplete for $failures article(s); read per-article reports"
            exit 1
          fi
      - name: Print findings for six frozen pilot articles
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('editorial-quality-reports/quality-report.json')
          if not path.is_file():
              print('PILOT_QUALITY_REPORT_MISSING')
              raise SystemExit(0)
          report=json.loads(path.read_text(encoding='utf-8'))
          for row in report.get('results',[]):
              slug=row.get('slug','')
              if '-pilot-' not in slug or not slug.endswith('-20261120'):
                  continue
              grammar=Path('editorial-quality-reports') / ('languagetool-'+slug+'.json')
              grammar_result=json.loads(grammar.read_text(encoding='utf-8')) if grammar.exists() else {'status':'missing'}
              print('PILOT_QA_RESULT',json.dumps({
                  'slug':slug,
                  'characters':row.get('characters_without_whitespace'),
                  'warnings':row.get('warnings'),
                  'images':row.get('images'),
                  'style':row.get('style'),
                  'grammar':grammar_result,
                  'rights_checked':report.get('image_rights_verified_by_this_check'),
                  'facts_checked':report.get('science_facts_verified') if row.get('channel')=='science' else report.get('film_facts_verified') if row.get('channel')=='cinema' else None
              },ensure_ascii=False))
          PY
      - name: Verify three RSS feeds without publishing
        run: |
          python src/build.py
          python src/rss_verify.py
      - name: Preserve quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-quality-review
          path: editorial-quality-reports/
          if-no-files-found: warn
          retention-days: 14
