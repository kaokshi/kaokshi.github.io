name: Klein visual feedback loop isolated regression
on:
  push:
    branches: [experiment/editorial-image-feedback-loop-20261123]
    paths: [.github/workflows/klein-image-feedback-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install light local tests
        run: python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2'
      - name: Run Klein and reviewer mocked regression cases
        run: python -m unittest -v tests.test_editorial_image_feedback tests.test_editorial_image_reranking
