name: Zen independent cloud-model comparison
on:
  pull_request:
    paths:
      - 'research/compare_editorial_models.py'
      - 'tests/test_editorial_model_benchmark.py'
      - '.github/workflows/editorial-model-cloud-benchmark.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [gemini, groq, hybrid]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only encryption dependency
        run: python -m pip install 'cryptography>=44,<48'
      - name: Offline fair-benchmark contract tests
        run: python -m unittest discover -s tests -p test_editorial_model_benchmark.py -v
      - name: Generate all three independent channel drafts privately or report missing credential
        run: python research/compare_editorial_models.py --backend ${{ matrix.backend }}
      - name: Upload numerical metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-${{ matrix.backend }}-comparison-metrics
          path: ${{ runner.temp }}/zen-model-compare/${{ matrix.backend }}-metadata.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload encrypted drafts only if actually generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-${{ matrix.backend }}-owner-encrypted
          path: ${{ runner.temp }}/zen-model-compare/zen-${{ matrix.backend }}-owner-review.enc
          if-no-files-found: ignore
          retention-days: 14
