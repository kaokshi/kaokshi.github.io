name: ZEN CORE cloud queue and private executor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-observation:
    if: github.ref == 'refs/heads/codex/zen-queue-observation'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Observe queue eligibility without exposing identifiers
        env:
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
        run: |
          python - <<'PYCODE'
          import json, os
          from urllib.request import Request, urlopen
          url = "https://zen-editorial-control.kvasrapr.workers.dev/internal/zen-core/queue"
          headers = {"Authorization": "Bearer " + os.environ["ZEN_CORE_INTAKE_SECRET"], "Content-Type": "application/json", "User-Agent": "ZEN-Control-Executor/1.0"}
          cursor = None
          for _ in range(10):
              response = Request(url, data=json.dumps({"cursor": cursor}).encode(), headers=headers)
              with urlopen(response, timeout=15) as reply:
                  page = json.load(reply)
              print(json.dumps({"emergencyPaused": page["stopped"], "eligibleCount": len(page["ids"]),
                                "morePages": page["nextCursor"] is not None}))
              cursor = page["nextCursor"]
              if cursor is None:
                  break
          PYCODE
