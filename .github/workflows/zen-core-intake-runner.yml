name: ZEN CORE cloud queue and private executor
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-core-intake-runner.yml']
  workflow_dispatch:
    inputs:
      settings_only:
        description: Synchronize RouterAI tariffs and model settings without processing orders or calling inference.
        type: boolean
        default: false
      pilot_job:
        description: Confirmed Telegram agent job ID, with two articles per channel. Empty runs intake only.
        type: string
        default: ''
      pilot_passes:
        description: Consecutive bounded passes for this pilot, 1 to 8.
        type: string
        default: '1'
  schedule:
    # Scheduled workflows only run from the default branch after integration.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: zen-core-intake-runner
  cancel-in-progress: false
jobs:
  sonnet-live-check:
    if: github.ref == 'refs/heads/codex/zen-sonnet-live-check' && github.event_name == 'workflow_dispatch' && inputs.settings_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore and test owner chat once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: node telegram-control/sonnet-live-check.mjs
  intake:
    if: (github.ref == 'refs/heads/integration/zen-core-routerai-20261124' && github.event_name != 'schedule') || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ZEN_CORE_INTAKE_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Reject conflicting settings and pilot inputs
        if: inputs.settings_only && (inputs.pilot_job != '' || inputs.pilot_passes != '1')
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check safety and cursor contract
        run: python -m unittest tests.test_editorial_zen_intake_runner tests.test_editorial_zen_control -q
      - name: Install production checks only for an explicitly enabled private executor
        if: github.ref == 'refs/heads/main' && !inputs.settings_only && (inputs.pilot_job != '' || (github.event_name == 'schedule' && vars.ZEN_CORE_PRODUCTION_ENABLED == 'true'))
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0' 'torchvision==0.26.0'
          python -m pip install -r requirements-production.txt 'sentencepiece==0.2.1' ruts
      - name: Refresh the private cinema catalogue for production
        if: github.ref == 'refs/heads/main' && !inputs.settings_only && (inputs.pilot_job != '' || (github.event_name == 'schedule' && vars.ZEN_CORE_PRODUCTION_ENABLED == 'true'))
        env:
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: python -m src.editorial_cinema_catalogue
      - name: Poll confirmed intents and return progress
        env:
          ZEN_CORE_INTAKE_ENDPOINT: 'https://zen-editorial-control.kvasrapr.workers.dev/internal/zen-core/intake'
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          ZEN_CORE_CONTROL_ENDPOINT: 'https://zen-editorial-control.kvasrapr.workers.dev/internal/zen-core/control'
          ZEN_CORE_PRODUCTION_ENABLED: ${{ github.ref == 'refs/heads/main' && !inputs.settings_only && (inputs.pilot_job != '' || (github.event_name == 'schedule' && vars.ZEN_CORE_PRODUCTION_ENABLED == 'true')) }}
          ZEN_CORE_SETTINGS_ONLY: ${{ github.ref == 'refs/heads/main' && inputs.settings_only == true }}
          ZEN_CORE_SETTINGS_SYNC_ENABLED: ${{ github.ref == 'refs/heads/main' && vars.ZEN_CORE_SETTINGS_SYNC_ENABLED == 'true' }}
          ZEN_CORE_PILOT_JOB: ${{ github.ref == 'refs/heads/main' && inputs.pilot_job || '' }}
          ZEN_CORE_PILOT_PASSES: ${{ inputs.pilot_passes || '1' }}
          OMP_NUM_THREADS: '2'
          ZEN_CORE_TELEGRAM_DOCX_JOB: ${{ github.ref == 'refs/heads/main' && vars.ZEN_CORE_TELEGRAM_DOCX_JOB || '' }}
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_OWNER_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_OWNER_ID || '' }}
          HF_HUB_DISABLE_XET: '1'
        run: python -u telegram-control/production_runner.py
