name: ZEN Browser Run auth entry probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-browser-account-exclusive
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CDP client
        working-directory: ${{ runner.temp }}
        run: npm install --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.56.1
      - name: Inspect official sign-in entry without credentials
        working-directory: ${{ runner.temp }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DZEN_STATS_URL: ${{ secrets.DZEN_SCIENCE_STATS_URL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const id = process.env.CF_ACCOUNT_ID;
            const token = process.env.CF_API_TOKEN;
            if (!id || !token || !process.env.DZEN_STATS_URL) {
              console.error('BROWSER_CONFIG_MISSING');
              process.exitCode = 1;
              return;
            }
            if (!/^[a-f0-9]{32}$/i.test(id)) {
              console.error('BROWSER_ACCOUNT_ID_INVALID');
              process.exitCode = 1;
              return;
            }
            let browser;
            let sessionId;
            const root = 'https://api.cloudflare.com/client/v4/accounts/' + id + '/browser-run/devtools/browser';
            const headers = { Authorization: 'Bearer ' + token };
            let stage = 'CONNECT';
            try {
              stage = 'ACQUIRE';
              const acquired = await fetch(root + '?keep_alive=10000', {method:'POST', headers, redirect:'error', signal:AbortSignal.timeout(15000)});
              if (!acquired.ok) throw new Error('HTTP ' + acquired.status);
              const payload = await acquired.json();
              const result = payload.result || payload;
              if (!/^[a-f0-9-]{36}$/i.test(result.sessionId || '')) throw new Error('SESSION_ID_MISSING');
              sessionId = result.sessionId;
              console.log('BROWSER_SESSION_ACQUIRED');
              stage = 'CONNECT';
              browser = await chromium.connectOverCDP(
                root.replace('https:', 'wss:') + '/' + sessionId,
                { headers, timeout: 15000 }
              );
              console.log('BROWSER_CONNECTED');
              stage = 'NAVIGATE';
              const context = browser.contexts()[0];
              const page = context.pages()[0] || await context.newPage();
              const target = new URL(process.env.DZEN_STATS_URL);
              if (target.origin !== 'https://dzen.ru' || !/^\/profile\/editor\/id\/[a-f0-9]+\/publications-stat$/.test(target.pathname)) throw new Error('Invalid configured route');
              const response = await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 15000 });
              stage = 'CLASSIFY_BEFORE';
              await page.waitForTimeout(2500);
              const classify = async p => {
                const u=new URL(p.url());
                const body=(await p.locator('body').innerText({timeout:2000}).catch(()=> '')).slice(0,30000);
                return {host:/^(?:[a-z0-9-]+\.)*(?:dzen\.ru|vk\.com|vk\.ru|yandex\.ru|yandex\.com|ya\.ru)$/.test(u.hostname)?u.hostname:'OTHER',challenge:/капча|подтвердите, что вы не робот|captcha|access denied|verify you are human/i.test(body),vk:/VK ID|ВКонтакте/i.test(body),yandex:/Яндекс ID|Яндекс Паспорт/i.test(body),phone:await p.locator('input[type=tel],input[autocomplete=tel]').count()>0,password:await p.locator('input[type=password]').count()>0,qr:/QR-код|QR code/i.test(body),login:/войти|вход|авторизац|регистрац/i.test(body)};
              };
              const before=await classify(page);
              if(before.challenge || before.host==='OTHER' || before.host!=='dzen.ru') {console.log('AUTH_ENTRY_STOP');process.exitCode=1;return;}
              console.log('AUTH_BEFORE='+JSON.stringify(before));
              stage='FIND_LOGIN';
              let button;
              const deadline=Date.now()+10000;
              do {
                for(const frame of page.frames()){
                  const host= new URL(frame.url()).hostname;
                  if(host!=='dzen.ru' && !host.endsWith('.dzen.ru')) continue;
                  const candidates=frame.getByRole('button',{name:'Войти',exact:true}).or(frame.getByRole('link',{name:'Войти',exact:true})).or(frame.locator('button[title="Войти"],a[title="Войти"],[role=button][aria-label="Войти"]')).filter({visible:true});
                  const count=await candidates.count();
                  if(count===1){button=candidates.first();break;}
                  if(count>1){console.log('AUTH_AMBIGUOUS_CONTROLS='+count);}
                }
                if(button)break;
                await page.waitForTimeout(500);
              }while(Date.now()<deadline);
              if(!button)throw new Error('LOGIN_CONTROL_NOT_FOUND');
              console.log('AUTH_LOGIN_CONTROL_FOUND');
              stage='CLICK_TRIAL';
              await button.click({trial:true,timeout:5000});
              stage='CLICK_LOGIN';
              await button.click({timeout:5000});
              console.log('AUTH_LOGIN_CLICKED');
              stage='CLASSIFY_AFTER';
              await page.waitForTimeout(4000);
              const pages=context.pages();
              let detected=false;
              for (const p of pages) {
                const result=await classify(p);
                console.log('AUTH_ENTRY='+JSON.stringify(result));
                if(result.challenge || result.host==='OTHER') {console.log('AUTH_ENTRY_STOP');process.exitCode=1;return;}
                if(result.vk || result.yandex || result.phone || result.password || result.qr || result.host!=='dzen.ru') detected=true;
              }
              console.log('AUTH_PROVIDER_DETECTED='+detected);
              if(!detected) process.exitCode=1;
            } catch (error) {
              const match = String(error?.message || '').match(/\b(401|403|404|429|500|502|503)\b/);
              console.error('BROWSER_' + stage + '_FAILED' + (match ? '_HTTP_' + match[1] : '') + (error?.name === 'TimeoutError' ? '_TIMEOUT' : ''));
              process.exitCode = 1;
            } finally {
              if (sessionId) {
                try {
                  let closed = false;
                  for (let attempt=0; attempt<3; attempt++) {
                    const response = await fetch(root + '/' + sessionId, {method:'DELETE', headers, redirect:'error', signal:AbortSignal.timeout(5000)});
                    if (response.status === 404 && attempt > 0) {closed=true;break;}
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const payload = await response.json();
                    const state = (payload.result || payload).status;
                    if (state === 'closed') {closed=true;break;}
                    if (state !== 'closing') throw new Error('UNKNOWN_CLOSE_STATE');
                    await new Promise(r=>setTimeout(r,1000));
                  }
                  if (!closed) throw new Error('CLOSE_UNCONFIRMED');
                  console.log('BROWSER_SESSION_CLOSE_CONFIRMED');
                } catch {
                  console.error('BROWSER_SESSION_CLOSE_UNCONFIRMED');
                  process.exitCode = 1;
                }
              }
              if (browser) await browser.close().catch(()=>{});
            }
          })().catch(() => { console.error('BROWSER_SMOKE_FAILED'); process.exitCode = 1; });
          JS
