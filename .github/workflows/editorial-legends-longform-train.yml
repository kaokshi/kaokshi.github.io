name: Train 400 long-form Russian mystery-proxy samples (four-detector research)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/editorial_genre_train_legends.py'
      - '.github/workflows/editorial-legends-longform-train.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longform-mystery-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install four text detectors and dataset loader
        run: |
          python -m pip install -r requirements-editorial.txt "datasets==3.6.0"
          aiw-ru models install modernbert lightgbm
      - name: Install pinned ruBERT v4
        run: |
          git clone --quiet https://github.com/k1y0miiii/ru-ai-text-detector.git .rubert-upstream
          git -C .rubert-upstream checkout --quiet 244e955427548f5856bb389cc8611f959911290c
          python -m venv .rubert-venv
          .rubert-venv/bin/python -m pip install --upgrade pip
          .rubert-venv/bin/python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          .rubert-venv/bin/python -m pip install "transformers==4.44.2" "scikit-learn==1.5.2" "numpy==1.26.4" "joblib==1.4.2" "huggingface_hub==0.26.5"
      - name: Download pinned ruBERT weights
        run: |
          .rubert-venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
            "k1y0mi/ru-ai-text-detector",
            repo_type="model",
            revision="175e75ec79e9471f3f5b4ab0da9b859188446807",
            allow_patterns=["v4_model/*", "v4_calibrator.joblib", "threshold_v4.json"],
            local_dir=".rubert-upstream/models",
          )
          PY
      - name: Evaluate 200 training and 200 research test literary samples
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python src/editorial_genre_train_legends.py --out editorial-expanded-legends
      - name: Upload weights and aggregate research metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-longform-400-research
          path: |
            editorial-expanded-legends/legends-expanded-model.json
            editorial-expanded-legends/legends-expanded-summary.json
          if-no-files-found: warn
          retention-days: 30
