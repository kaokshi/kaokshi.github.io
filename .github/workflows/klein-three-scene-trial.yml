name: Klein and OpenCV three-scene comparison
on:
  push:
    branches:
      - feature/editorial-cloudflare-free-image
    paths:
      - .github/workflows/klein-three-scene-trial.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  three-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEN_CLOUDFLARE_FREE_PLAN_CONFIRMED: "true"
      ZEN_IMAGE_ALLOW_PAID: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-comparison-one-image
          run-id: 44900179845
          github-token: ${{ github.token }}
          path: originals/first
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-scenes-2-and-3
          run-id: 44900806627
          github-token: ${{ github.token }}
          path: originals/other
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless requests
      - name: Prepare original scene copies
        run: |
          mkdir -p scenes
          cp originals/first/cloudflare-flux-schnell.jpg scenes/cloudflare-scene-1.jpg
          cp originals/other/cloudflare-scene-2.jpg scenes/cloudflare-scene-2.jpg
          cp originals/other/cloudflare-scene-3.jpg scenes/cloudflare-scene-3.jpg
      - name: Edit three existing scenes through Klein and cinematic OpenCV polish
        run: python src/editorial_klein_three_trial.py --scene-dir scenes --output-dir comparison
      - name: Preserve private results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klein-opencv-three-scenes-results
          path: comparison/
          retention-days: 2
          if-no-files-found: error
