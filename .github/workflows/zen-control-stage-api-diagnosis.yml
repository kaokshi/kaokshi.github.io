name: ZEN CONTROL stage API diagnosis
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-stage-api-diagnosis.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check rejected stage requests without state changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from "node:crypto";
          const p=new URLSearchParams({auth_date:String(Math.floor(Date.now()/1000)),user:JSON.stringify({id:Number(process.env.TELEGRAM_OWNER_ID),is_bot:false}),query_id:"diagnostic"});
          const data=[...p.entries()].sort(([a],[b])=>a<b?-1:a>b?1:0).map(([k,v])=>k+"="+v).join("\n");
          const key=createHmac("sha256","WebAppData").update(process.env.TELEGRAM_BOT_TOKEN).digest();
          p.set("hash",createHmac("sha256",key).update(data).digest("hex"));
          for(const [label,body] of [["DENIED",{initData:"invalid",confirm:true}],["NO_CONFIRM",{initData:p.toString(),confirm:false}],["INVALID_STAGE",{initData:p.toString(),confirm:true,id:"invalid-diagnostic",article:"invalid",stage:"rss",version:0,observedAt:0,modeRevision:0}]]){
            const r=await fetch("https://zen-editorial-control.kvasrapr.workers.dev/api/core/jobs/stage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),redirect:"error",signal:AbortSignal.timeout(15000)});
            let error="non_json";try{const d=await r.json();if(typeof d.error==="string"&&/^[a-z_]{1,80}$/.test(d.error))error=d.error;}catch{}
            console.log(label+" HTTP="+r.status+" CODE="+error);
          }
          JS
