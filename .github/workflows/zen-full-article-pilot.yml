name: Zen complete single article pilot (Groq OpenRouter Model A)
on:
  pull_request:
    paths:
      - 'research/zen_full_article_pilot.py'
      - '.github/workflows/zen-full-article-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install existing editorial detectors and encrypted review tools
        run: |
          python -m pip install -r requirements-editorial.txt
          python -m pip install 'cryptography>=44,<48'
      - name: Download existing open local Model A classifiers
        run: aiw-ru models install modernbert lightgbm transformer
      - name: Generate, fully edit, conditionally repair and check one complete article
        run: python research/zen_full_article_pilot.py
      - name: Upload strictly numerical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-single-full-pilot-diagnostics
          path: ${{ runner.temp }}/zen-article-full-pilot/metrics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only owner-encrypted full article and revision archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-single-full-pilot-owner-encrypted
          path: ${{ runner.temp }}/zen-article-full-pilot/owner-editorial-versions.enc
          if-no-files-found: warn
          retention-days: 7
