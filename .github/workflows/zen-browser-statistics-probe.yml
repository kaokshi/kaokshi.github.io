name: ZEN Browser Run exact statistics route
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-browser-account-exclusive
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CDP client
        working-directory: ${{ runner.temp }}
        run: npm install --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.56.1
      - name: Inspect rendered login controls without credentials
        working-directory: ${{ runner.temp }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DZEN_STATS_URL: ${{ secrets.DZEN_SCIENCE_STATS_URL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const id = process.env.CF_ACCOUNT_ID;
            const token = process.env.CF_API_TOKEN;
            if (!id || !token || !process.env.DZEN_STATS_URL) {
              console.error('BROWSER_CONFIG_MISSING');
              process.exitCode = 1;
              return;
            }
            if (!/^[a-f0-9]{32}$/i.test(id)) {
              console.error('BROWSER_ACCOUNT_ID_INVALID');
              process.exitCode = 1;
              return;
            }
            let browser;
            let sessionId;
            let runtimeWatchdog;
            const root = 'https://api.cloudflare.com/client/v4/accounts/' + id + '/browser-run/devtools/browser';
            const headers = { Authorization: 'Bearer ' + token };
            let stage = 'CONNECT';
            try {
              stage = 'BUDGET';
              const midnight = new Date();
              midnight.setUTCHours(0,0,0,0);
              const now=Date.now(), dayStart=midnight.getTime();
              const seen=new Set();
              let used=0, complete=false;
              for(let offset=0;offset<10000;offset+=100){
                const response=await fetch(root.replace(/\/browser$/,'/session')+'?limit=100&offset='+offset,{headers,redirect:'error',signal:AbortSignal.timeout(10000)});
                if(!response.ok) throw new Error('HTTP '+response.status);
                const data=await response.json();
                const rows=Array.isArray(data)?data:data.result;
                if(!Array.isArray(rows))throw new Error('INVALID_HISTORY');
                for(const row of rows){
                  if(typeof row.sessionId!=='string'||seen.has(row.sessionId))throw new Error('HISTORY_DUPLICATE');
                  seen.add(row.sessionId);
                  const start=row.startTime, end=row.endTime;
                  if(!Number.isFinite(start)||start<1e12||start>now)throw new Error('INVALID_START');
                  if(end==null||end===0)throw new Error('ACTIVE_SESSION_EXISTS');
                  if(!Number.isFinite(end)||end<start||end>now+5000)throw new Error('INVALID_END');
                  used+=Math.max(0,Math.min(now,end)-Math.max(start,dayStart));
                }
                if(rows.length<100){complete=true;break;}
              }
              if(!complete)throw new Error('HISTORY_INCOMPLETE');
              const allowance=90000;
              console.log('BROWSER_SESSION_USAGE_MS='+used);
              console.log('BROWSER_WORKING_BUDGET_MS=480000');
              if(used+allowance>480000 || now+allowance>=dayStart+86400000){
                console.log('BROWSER_BUDGET_STOP');
                return;
              }
              stage = 'ACQUIRE';
              const acquired = await fetch(root + '?keep_alive=10000', {method:'POST', headers, redirect:'error', signal:AbortSignal.timeout(15000)});
              if (!acquired.ok) throw new Error('HTTP ' + acquired.status);
              const payload = await acquired.json();
              const result = payload.result || payload;
              if (!/^[a-f0-9-]{36}$/i.test(result.sessionId || '')) throw new Error('SESSION_ID_MISSING');
              sessionId = result.sessionId;
              console.log('BROWSER_SESSION_ACQUIRED');
              const watchdog=setTimeout(async()=>{
                try { await fetch(root+'/'+sessionId,{method:'DELETE',headers,redirect:'error',signal:AbortSignal.timeout(5000)}); } catch {}
                console.error('BROWSER_RUNTIME_LIMIT');
                process.exit(1);
              },60000);
              watchdog.unref();
              runtimeWatchdog=watchdog;
              stage = 'CONNECT';
              browser = await chromium.connectOverCDP(
                root.replace('https:', 'wss:') + '/' + sessionId,
                { headers, timeout: 15000 }
              );
              console.log('BROWSER_CONNECTED');
              stage = 'NAVIGATE';
              const context = browser.contexts()[0];
              const page = context.pages()[0] || await context.newPage();
              const target = new URL(process.env.DZEN_STATS_URL);
              if (target.origin !== 'https://dzen.ru' || !/^\/profile\/editor\/id\/[a-f0-9]+\/publications-stat$/.test(target.pathname)) throw new Error('Invalid configured route');
              const response = await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 15000 });
              stage = 'ASSERT';
              const deadline = Date.now() + 10000;
              let login = false, challenge = false, studio = false, host = '', bodyLength = 0;
              do {
                host = new URL(page.url()).hostname;
                const body = (await page.locator('body').innerText({timeout: 1500}).catch(() => '')).slice(0, 30000);
                bodyLength = body.length;
                challenge = /капча|подтвердите, что вы не робот|captcha|access denied|verify you are human/i.test(body);
                login = /(?:^|\.)passport\.yandex\.(?:ru|com)$/.test(host) || /войти|авторизац|вход в аккаунт|вход в дзен/i.test(body) || await page.locator('input[type=password], input[autocomplete=username]').count() > 0;
                studio = /статистика|монетизация|публикации/i.test(body);
                if (challenge || login) break;
                await new Promise(r => setTimeout(r, 500));
              } while (Date.now() < deadline);
              const knownHost = /(?:^|\.)(?:dzen\.ru|yandex\.ru|yandex\.com|ya\.ru|vk\.com|vk\.ru)$/.test(host);
              console.log('DZEN_HTTP_STATUS=' + (response?.status() || 0));
              console.log('DZEN_KNOWN_HOST=' + knownHost);
              console.log('DZEN_HOST_CATEGORY=' + (knownHost ? host : 'OTHER'));
              console.log('DZEN_RENDERED_TEXT_LENGTH=' + bodyLength);
              console.log('DZEN_CHALLENGE=' + challenge);
              console.log('DZEN_LOGIN_HINT=' + login);
              console.log('DZEN_STUDIO_HINT=' + studio);
              if (!knownHost || challenge || !login) throw new Error('Login interface not confirmed');
              console.log('DZEN_LOGIN_INTERFACE_CONFIRMED');
            } catch (error) {
              const match = String(error?.message || '').match(/\b(401|403|404|429|500|502|503)\b/);
              console.error('BROWSER_' + stage + '_FAILED' + (match ? '_HTTP_' + match[1] : ''));
              process.exitCode = 1;
            } finally {
              if (runtimeWatchdog) clearTimeout(runtimeWatchdog);
              if (sessionId) {
                try {
                  let closed = false;
                  for (let attempt=0; attempt<3; attempt++) {
                    const response = await fetch(root + '/' + sessionId, {method:'DELETE', headers, redirect:'error', signal:AbortSignal.timeout(5000)});
                    if (response.status === 404 && attempt > 0) {closed=true;break;}
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const payload = await response.json();
                    const state = (payload.result || payload).status;
                    if (state === 'closed') {closed=true;break;}
                    if (state !== 'closing') throw new Error('UNKNOWN_CLOSE_STATE');
                    await new Promise(r=>setTimeout(r,1000));
                  }
                  if (!closed) throw new Error('CLOSE_UNCONFIRMED');
                  console.log('BROWSER_SESSION_CLOSE_CONFIRMED');
                } catch {
                  console.error('BROWSER_SESSION_CLOSE_UNCONFIRMED');
                  process.exitCode = 1;
                }
              }
              if (browser) await browser.close().catch(()=>{});
            }
          })().catch(() => { console.error('BROWSER_SMOKE_FAILED'); process.exitCode = 1; });
          JS
