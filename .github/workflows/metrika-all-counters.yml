name: Verify all three ZEN Metrika counters
on:
  push:
    branches: [assistant/zen-control-statistics-20261124]
    paths: ['.github/workflows/metrika-all-counters.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify counter access and measured Dzen traffic
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          token=os.environ.get("YANDEX_METRIKA_TOKEN","").strip()
          if not token: raise SystemExit("TOKEN_MISSING")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def get(label,path,params=None):
              url="https://api-metrika.yandex.net"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              try:
                  with opener.open(urllib.request.Request(url,headers={"Authorization":"OAuth "+token,"Accept":"application/json"}),timeout=20) as r:
                      print(label+"_HTTP="+str(r.status))
                      return json.load(r)
              except urllib.error.HTTPError as e: print(label+"_HTTP="+str(e.code))
              except Exception: print(label+"_CONNECTION_FAILED")
              return None
          listing=get("LIST","/management/v1/counters",{"per_page":100})
          if not isinstance(listing,dict): raise SystemExit(1)
          targets={"CINEMA":"114654979","SCIENCE":"114655465"}
          legends=[str(c.get("id")) for c in listing.get("counters",[]) if str(c.get("name","")).strip().casefold()=="zen legends" and str(c.get("id","")).isdigit()]
          print("LEGENDS_MATCHES="+str(len(legends)))
          if len(legends)==1 and legends[0] not in targets.values(): targets["LEGENDS"]=legends[0]
          failed=len(targets)!=3
          for label,cid in targets.items():
              print(label+"_ID="+cid)
              counter=get(label+"_COUNTER","/management/v1/counter/"+cid)
              params={"ids":cid,"metrics":"ym:s:visits,ym:s:pageviews,ym:s:users","date1":"7daysAgo","date2":"today","accuracy":"full"}
              report=get(label+"_REPORT","/stat/v1/data",params)
              ok=isinstance(counter,dict) and str(counter.get("counter",{}).get("id"))==cid and isinstance(report,dict) and isinstance(report.get("totals"),list) and len(report["totals"])==3
              print(label+"_VERIFIED="+str(ok).lower())
              if ok:
                  print(label+"_TRAFFIC_PRESENT="+str(any(x>0 for x in report["totals"] if isinstance(x,(int,float)))).lower())
              pages=get(label+"_DZEN_PAGES","/stat/v1/data",{"ids":cid,"metrics":"ym:pv:pageviews","dimensions":"ym:pv:URL","filters":"ym:pv:URL=~'https?://([^/]+\\.)?dzen\\.ru(/|$)'","date1":"7daysAgo","date2":"today","accuracy":"full","limit":1})
              if isinstance(pages,dict) and isinstance(pages.get("totals"),list) and len(pages["totals"])==1:
                  print(label+"_DZEN_PAGEVIEWS_PRESENT="+str(isinstance(pages["totals"][0],(int,float)) and pages["totals"][0]>0).lower())
              else: print(label+"_DZEN_PAGEVIEWS_UNVERIFIED")
              sources=get(label+"_SOURCES","/stat/v1/data",{"ids":cid,"metrics":"ym:s:visits","dimensions":"ym:s:lastTrafficSource","date1":"7daysAgo","date2":"today","accuracy":"full","limit":20})
              print(label+"_SOURCE_REPORT_OK="+str(isinstance(sources,dict) and isinstance(sources.get("data"),list)).lower())
              failed=failed or not ok
          raise SystemExit(int(failed))
          PY
