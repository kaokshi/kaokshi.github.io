name: Ruff + reviewdog (Python feedback only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'ruff.toml'
      - '.github/workflows/editorial-ruff-reviewdog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  python-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.6"
      - name: Show Ruff version
        run: ruff --version
      - name: Generate reviewdog-compatible diagnostics without editing files
        run: |
          ruff check --output-format=rdjson --exit-zero src tests > "$RUNNER_TEMP/ruff-rdjson.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path=Path(os.environ['RUNNER_TEMP'])/'ruff-rdjson.json'
          report=json.loads(report_path.read_text())
          # Ruff rdjson contains absolute runner paths; GitHub PR API expects
          # paths relative to the repository. Absolute paths cause HTTP 422.
          repo_root=Path.cwd().resolve()
          for diagnostic in report.get('diagnostics',[]):
              location=diagnostic.get('location') or {}
              if 'path' in location:
                  absolute=Path(location['path']).resolve()
                  try:
                      location['path']=absolute.relative_to(repo_root).as_posix()
                  except ValueError as exc:
                      raise RuntimeError('Ruff emitted path outside the repository') from exc
          report_path.write_text(json.dumps(report,ensure_ascii=False))
          print("RUFF_DIAGNOSTICS",len(report.get('diagnostics',[])))
          for diagnostic in report.get('diagnostics',[]):
              loc=diagnostic.get('location') or {}
              print("RUFF_FINDING", json.dumps({
                  "path":diagnostic.get("code",{}).get("url") if isinstance(diagnostic.get("code"),dict) else None,
                  "message":diagnostic.get("message"),
                  "rule":diagnostic.get("code",{}).get("value") if isinstance(diagnostic.get("code"),dict) else str(diagnostic.get("code")),
                  "source":diagnostic.get("source",{}).get("name") if isinstance(diagnostic.get("source"),dict) else None,
                  "location":loc
              },ensure_ascii=False))
          PY
      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0
      - name: Annotate changed Python lines on Pull Request
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -name="Ruff Python" -reporter=github-pr-review \
            -filter-mode=added -fail-level=none < "$RUNNER_TEMP/ruff-rdjson.json"
      - name: Check Python syntax and high-confidence errors (no rewrite)
        run: |
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
      - name: Run safety regression tests for changed Python modules
        run: |
          python -m unittest discover -s tests -p 'test_editorial_auto_route.py' -v
          python -m unittest discover -s tests -p 'test_editorial_ensemble.py' -v
          python -m unittest discover -s tests -p 'test_editorial_research_train.py' -v
          python -m unittest discover -s tests -p 'test_editorial_research_v2.py' -v
