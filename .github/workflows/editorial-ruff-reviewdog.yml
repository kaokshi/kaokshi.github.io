name: Ruff + reviewdog (Python feedback only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'ruff.toml'
      - '.github/workflows/editorial-ruff-reviewdog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  python-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.6"
      - name: Show Ruff version
        run: ruff --version
      - name: Generate reviewdog-compatible diagnostics without editing files
        run: |
          ruff check --output-format=rdjson --exit-zero src tests > "$RUNNER_TEMP/ruff-rdjson.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'ruff-rdjson.json').read_text())
          print("RUFF_DIAGNOSTICS",len(report.get('diagnostics',[])))
          PY
      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0
      - name: Annotate changed Python lines on Pull Request
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -name="Ruff Python" -reporter=github-pr-review \
            -filter-mode=added -fail-level=none < "$RUNNER_TEMP/ruff-rdjson.json"
      - name: Check Python syntax and high-confidence errors (no rewrite)
        run: |
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
