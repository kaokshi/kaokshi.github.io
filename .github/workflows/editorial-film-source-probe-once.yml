name: Free cinema factual source probe without LLM calls
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-film-source-probe-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  film-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline film source parsing
        run: python -m unittest -q tests.test_movie_fact_check
      - name: Query public metadata for one unreviewed cinema film
        run: |
          python - <<'PY'
          import json
          from src.movie_autonomous_research import movie_sources
          from src.editorial_providers import Blocked
          try:
              result = movie_sources("discover", {"topic": "«Пленницы» (2013)"})
              film = result["film"]
              print(json.dumps({
                  "status": result["status"],
                  "film": film["title"],
                  "year_verified": 2013 in film["years"],
                  "director_count": len(film["directors"]),
                  "source_count": len(result["documents"]),
                  "second_document_chars": len(result["documents"][1]["text"]),
                  "publication_authorized": False,
              }, ensure_ascii=False))
              assert 2013 in film["years"] and film["directors"]
          except Blocked as exc:
              print(json.dumps({"status": "blocked", "safe_error": str(exc),
                                "publication_authorized": False}))
              raise SystemExit(2)
          PY
      - name: Verify independent factual review sources for selected film
        run: |
          python - <<'PY'
          import json
          from src.editorial_cinema import evidence
          from src.editorial_providers import Blocked
          plan = {
              "film_title": "Пленницы",
              "year": 2013,
              "format": "review",
              "spoilers": False,
              "sources": [
                  "https://www.rottentomatoes.com/m/prisoners_2013",
                  "https://www.rogerebert.com/reviews/prisoners-2013",
                  "https://www.theguardian.com/film/2013/sep/26/prisoners-review",
              ],
          }
          try:
              row = evidence(plan, {})
              print(json.dumps({
                  "status": "cinema_independent_sources_verified",
                  "film": row["film"]["title"],
                  "format": row["format"],
                  "spoilers": row["spoilers"],
                  "records": len(row["records"]),
                  "independent_sources": len(row["records"]) - 1,
                  "plot_events_verified": row["detailed_plot_evidence"],
                  "publication_authorized": False,
              }, ensure_ascii=False))
              assert row["format"] == "review" and len(row["records"]) >= 2
          except Blocked as exc:
              print(json.dumps({"status": "cinema_sources_blocked",
                                "reason_code": str(exc) if str(exc).startswith(("film_", "movie_")) else "unclassified_block",
                                "publication_authorized": False}))
              raise SystemExit(2)
          PY
