name: Editorial image matching experiment
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/editorial_image*.py'
      - 'src/editorial_visual_matching.py'
      - 'benchmarks/editorial_image_matching.json'
      - '.github/workflows/editorial-image-matching.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-comparison:
    if: >-
      github.repository == 'kaokshi/kaokshi.github.io' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/editorial-image-matching') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/editorial-image-matching'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '75'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU models and dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0' 'torchvision==0.26.0'
          python -m pip install 'transformers==5.24.0' 'sentencepiece==0.2.1' -r requirements-quality.txt
      - name: Load and verify frozen reference images
        run: timeout 4m python -m src.editorial_image_benchmark download --workspace "$RUNNER_TEMP/image-bench"
      - name: Measure the current CLIP baseline
        run: |
          ulimit -v 12582912
          timeout --kill-after=15s 8m python -m src.editorial_image_benchmark clip --workspace "$RUNNER_TEMP/image-bench"
      - name: Rank all candidates with SigLIP 2
        run: |
          ulimit -v 12582912
          timeout --kill-after=15s 8m python -m src.editorial_image_benchmark siglip --workspace "$RUNNER_TEMP/image-bench"
      - name: Verify the shortlist with Florence-2
        run: |
          ulimit -v 12582912
          timeout --kill-after=15s 8m python -m src.editorial_image_benchmark florence --workspace "$RUNNER_TEMP/image-bench"
      - name: Compare the results with the frozen visual labels
        run: python -m src.editorial_image_benchmark report --workspace "$RUNNER_TEMP/image-bench"
      - name: Archive scores and reusable thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-image-benchmark
          path: |
            ${{ runner.temp }}/image-bench/*.json
            ${{ runner.temp }}/image-bench/contact-sheet.jpg
          if-no-files-found: ignore
          retention-days: 14
