name: Zen autonomous end-to-end real science pilot
on:
  pull_request:
    paths:
      - 'research/zen_autonomous_science_pilot.py'
      - '.github/workflows/zen-autonomous-science-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install existing diagnostic dependencies and document tooling
        run: |
          python -m pip install -r requirements-editorial.txt
          python -m pip install Pillow python-docx
          aiw-ru models install modernbert lightgbm transformer
      - name: One autonomous article plus NASA image sourcing, full editor and diagnostics
        run: python research/zen_autonomous_science_pilot.py
      - name: Upload owner-ready draft and genuine images from GitHub agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-owner-autonomous-science-full-package
          path: ${{ runner.temp }}/zen-autonomous-complete/owner-review.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Upload audit and source trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-autonomous-science-audit
          path: |
            ${{ runner.temp }}/zen-autonomous-complete/report.json
            ${{ runner.temp }}/zen-autonomous-complete/image_sources.json
          if-no-files-found: warn
          retention-days: 7
