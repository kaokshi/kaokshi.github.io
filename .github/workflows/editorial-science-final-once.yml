name: Science final mixed visual pack in private review
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-science-final-once.yml
      - src/editorial_science_finish.py
permissions:
  contents: read
concurrency:
  group: science-final-private-review
  cancel-in-progress: false
jobs:
  science-finish:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
      EDITORIAL_CF_FREE_ONLY: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no public publication or text generator keys
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('config/site.json').read_text())
          c=json.loads(Path('config/editorial_production.json').read_text())
          assert s['publication_enabled'] is False
          assert c['schedule']['enabled'] is False
          assert c['schedule']['owner_approved'] is False
          assert os.environ.get('EDITORIAL_PRIVATE_TOKEN')
          assert os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          assert os.environ.get('CLOUDFLARE_API_TOKEN')
          for name in ('GROQ_API_KEY','GEMINI_API_KEY','OVH_API_KEY','OPENROUTER_API_KEY','KILO_API_KEY'):
              assert not os.environ.get(name)
          print('Science only: private owner review; no text models, publishing or RSS enabled.')
          PY
      - name: Install pinned visual matching, private DOCX and photo metadata dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'transformers==5.24.0' 'pillow>=11,<13' 'python-docx==1.2.0' 'ImageHash>=4.3,<5'
          python -m pip install 'cryptography>=44,<48'
      - name: Check science image layout and source-only safety tests
        run: |
          python -m compileall -q src/editorial_science_finish.py
          python -m unittest -q tests.test_editorial_science_mixed_images
      - name: Download 5 licensed photos and generate 2 free Klein illustrations
        id: full_article
        timeout-minutes: 52
        run: |
          umask 077
          python -m src.editorial_science_finish --date 2026-11-23
      - name: Verify publication stays frozen after private export
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('config/site.json').read_text())['publication_enabled'] is False
          print('No public article was posted.')
          PY
