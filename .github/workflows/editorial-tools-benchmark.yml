name: EXPERIMENT - Editorial tools benchmark (no publication)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/editorial-tools-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pilot libraries
        run: |
          python -m pip install 'ruts' 'natasha' 'pyalex' 'feedparser'
      - name: Run real editorial three-channel probes
        run: python experiments/tool_benchmark.py
      - name: Check GitHub Actions syntax with actionlint
        continue-on-error: true
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color=false -oneline > editorial-benchmark-results/actionlint.txt 2>&1
          rc=$?
          echo "actionlint_exit=$rc"
          cat editorial-benchmark-results/actionlint.txt
          exit "$rc"
      - name: Read-only Gitleaks scan
        continue-on-error: true
        run: |
          curl -fsSL --retry 2 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --report-format json --report-path editorial-benchmark-results/gitleaks.json . > /tmp/gitleaks_log.txt 2>&1
          rc=$?
          echo "gitleaks_exit=$rc" >> editorial-benchmark-results/check-summary.txt
          echo "gitleaks_exit=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "Gitleaks reported findings or failed; review restricted report, do not copy secrets to logs"
          fi
      - name: Post-tool machine-readable summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path('editorial-benchmark-results/benchmark.json')
          if f.is_file():
              j=json.loads(f.read_text())
              print('BENCHMARK_RESULTS:',len(j['probes']))
              print('SUCCESS:',sum(x['status']=='completed' for x in j['probes']))
              print('UNAVAILABLE:',sum(x['status']=='unavailable' for x in j['probes']))
          else:
              print('BENCHMARK_NOT_CREATED')
          PY
      - name: Upload internal benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-editorial-tools
          path: editorial-benchmark-results/
          retention-days: 7
          if-no-files-found: warn
