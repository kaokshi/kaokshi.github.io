name: Grounding DINO metro object-count live CPU trial
on:
  push:
    branches: [experiment/editorial-image-strict-20261123]
    paths: [.github/workflows/metro-grounding-count.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact source frames from completed isolated pilots
        run: |
          mkdir -p metro-count-input/original metro-count-input/new source-download
          gh run download 45027517283 --repo "${{ github.repository }}" -n zen-mystery-owner-readable -D source-download
          unzip -o source-download/owner-review-readable.zip -d metro-count-input/original
          gh run download 45054918042 --repo "${{ github.repository }}" -n metro-klein-real-corrected-images -D metro-count-input/new
          test -f metro-count-input/original/images/06-control-room.jpg
          test -f metro-count-input/new/four-clocks-attempt-1.jpg
          test -f metro-count-input/new/four-clocks-attempt-2.jpg
      - name: Install free CPU detection dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'transformers==5.24.0' 'timm>=1.0,<2'
      - name: Actually count wall clocks in three existing images
        timeout-minutes: 30
        run: python -m research.metro_grounding_dino_count_trial
      - name: Upload review-only count evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-count-object-detection
          path: metro-object-count/
          retention-days: 7
          if-no-files-found: warn
