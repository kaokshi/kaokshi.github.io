name: Real Klein metro scene repair (free-only, review-only)
# Repeat with isolated diagnostics of visual reviewer error
on:
  push:
    branches: [experiment/editorial-image-feedback-loop-20261123]
    paths: [.github/workflows/metro-klein-real-feedback.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDITORIAL_CF_FREE_ONLY: 'true'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve original existing story images without rewriting article
        run: |
          mkdir -p metro-audit-source metro-audit-download
          gh run download 45027517283 --repo "${{ github.repository }}" -n zen-mystery-owner-readable -D metro-audit-download
          unzip -o metro-audit-download/owner-review-readable.zip -d metro-audit-source
          test -f metro-audit-source/images/05-tunnel.jpg
          test -f metro-audit-source/images/06-control-room.jpg
      - name: Install open CPU models
        timeout-minutes: 15
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2' 'transformers==5.24.0' 'sentencepiece>=0.2'
      - name: Generate no more than four free-only Klein scenes and check each
        timeout-minutes: 45
        run: python -m research.metro_klein_real_feedback
      - name: Provide artifacts to owner for review (no RSS and no publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-klein-real-corrected-images
          path: metro-klein-feedback-results/
          retention-days: 1
          if-no-files-found: warn
