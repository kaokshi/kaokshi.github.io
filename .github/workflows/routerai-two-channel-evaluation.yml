name: Private RouterAI Seedream two-channel evaluation
on:
  pull_request:
    paths:
      - '.github/workflows/routerai-two-channel-evaluation.yml'
      - 'src/editorial_routerai_*.py'
      - 'tests/test_editorial_routerai_*.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routerai-two-channel-evaluation
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic checks without secrets
        run: python -m unittest tests.test_editorial_routerai_adapter tests.test_editorial_routerai_two_articles -q
  private-test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kaokshi/kaokshi.github.io' &&
      github.ref == 'refs/heads/codex/routerai-seedream-two-channel' &&
      github.run_attempt == 1
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '75'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required secret bindings
        env:
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: |
          if [[ -z "$EDITORIAL_PRIVATE_TOKEN" ]]; then
            echo '::error::private_storage_secret_missing'
            exit 1
          fi
          if [[ -z "$ROUTERAI_API_KEY" ]]; then
            echo '::error::routerai_api_key_missing'
            exit 1
          fi
      - name: Install editorial quality tools and pinned CPU vision models
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0' 'torchvision==0.26.0'
          python -m pip install 'transformers==5.24.0' 'sentencepiece==0.2.1' -r requirements-quality.txt
      - name: Run one private text and image evaluation
        env:
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: python -m src.editorial_routerai_two_articles
