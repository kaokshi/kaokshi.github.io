name: Zen Groq-first independent critic experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-groq-first-critics
  cancel-in-progress: false
jobs:
  compare-critics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_CRITIC_MODEL: ${{ vars.MISTRAL_CRITIC_MODEL }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      SAMBANOVA_CRITIC_MODEL: ${{ vars.SAMBANOVA_CRITIC_MODEL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CRITIC_MODEL: ${{ vars.CLOUDFLARE_CRITIC_MODEL }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install owner-only encryption
        run: python -m pip install 'cryptography>=44,<48'
      - name: Test new sequence without cloud calls
        run: python -m unittest discover -s tests -p test_groq_gemini_critics.py -v
      - name: Run opt-in sequence
        run: python research/compare_groq_gemini_critics.py
      - name: Save mechanical metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-groq-first-critic-metrics
          path: ${{ runner.temp }}/zen-groq-gemini-critics/metrics.json
          retention-days: 7
          if-no-files-found: warn
      - name: Save encrypted owner-only drafts and critiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-groq-first-owner-encrypted
          path: ${{ runner.temp }}/zen-groq-gemini-critics/private-owner-review.enc
          retention-days: 7
          if-no-files-found: ignore
