name: ZEN CONTROL connection audit (read only)
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-connection-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-control-connection-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/integration/zen-core-routerai-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured credentials and read-only connections
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.TELEGRAM_OWNER_ID }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
          REVIEW_TOKEN: ${{ secrets.EDITORIAL_REVIEW_READ_TOKEN }}
          ROUTER_TOKEN: ${{ secrets.ROUTERAI_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const e=process.env;
          const status=(name,ok)=>console.log(name+"="+(ok?"OK":"NOT_CONFIRMED"));
          const checks={
            CLOUDFLARE_WORKERS_TOKEN:!!e.CF_TOKEN,
            CLOUDFLARE_ACCOUNT_ID:/^[a-f0-9]{32}$/i.test(e.CF_ACCOUNT||""),
            TELEGRAM_BOT_TOKEN:/^\d+:[A-Za-z0-9_-]+$/.test(e.BOT_TOKEN||""),
            TELEGRAM_OWNER_ID:/^[1-9]\d{0,15}$/.test(e.OWNER||"")&&Number.isSafeInteger(Number(e.OWNER)),
            TELEGRAM_WEBHOOK_SECRET:/^[A-Za-z0-9_-]{32,256}$/.test(e.WEBHOOK_SECRET||""),
            ZEN_CORE_INTAKE_SECRET:/^[a-fA-F0-9]{64}$/.test(e.INTAKE_SECRET||""),
            EDITORIAL_REVIEW_READ_TOKEN:!!e.REVIEW_TOKEN,
            ROUTERAI_API_KEY:!!e.ROUTER_TOKEN
          };
          for(const [name,ok] of Object.entries(checks))status(name,ok);
          async function json(url,headers={}){
            const r=await fetch(url,{headers,redirect:"error",signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error("unavailable");
            return r.json();
          }
          async function probe(name,fn){try{const ok=await fn();status(name,ok===true);return ok===true;}catch{status(name,false);return false;}}
          let endpoint=null;
          const cf=await probe("CLOUDFLARE_EXISTING_WORKER",async()=>{
            if(!checks.CLOUDFLARE_WORKERS_TOKEN||!checks.CLOUDFLARE_ACCOUNT_ID)return false;
            const root="https://api.cloudflare.com/client/v4/accounts/"+e.CF_ACCOUNT+"/workers";
            const headers={Authorization:"Bearer "+e.CF_TOKEN};
            const sub=await json(root+"/subdomain",headers);
            const settings=await json(root+"/scripts/zen-editorial-control/settings",headers);
            if(sub.success!==true||settings.success!==true||!/^[a-z0-9][a-z0-9-]{0,62}$/.test(sub.result?.subdomain||""))return false;
            endpoint="https://zen-editorial-control."+sub.result.subdomain+".workers.dev";
            return settings.result?.bindings?.some(b=>b.name==="REVIEW_JOURNAL"&&b.type==="durable_object_namespace"&&b.class_name==="ReviewJournal")===true;
          });
          const telegram=await probe("TELEGRAM_EXISTING_WEBHOOK",async()=>{
            if(!checks.TELEGRAM_BOT_TOKEN||!endpoint)return false;
            const d=await json("https://api.telegram.org/bot"+e.BOT_TOKEN+"/getWebhookInfo");
            return d.ok===true&&d.result?.url===endpoint+"/telegram";
          });
          const hook=await probe("EXISTING_WEBHOOK_SECRET_MATCH",async()=>{
            if(!telegram||!checks.TELEGRAM_WEBHOOK_SECRET)return false;
            const r=await fetch(endpoint+"/telegram",{method:"POST",headers:{"X-Telegram-Bot-Api-Secret-Token":e.WEBHOOK_SECRET,"Content-Type":"application/json"},body:"{}",redirect:"error",signal:AbortSignal.timeout(8000)});
            return r.status===200;
          });
          const review=await probe("PRIVATE_LEDGER_READ",async()=>{
            if(!checks.EDITORIAL_REVIEW_READ_TOKEN)return false;
            const headers={Authorization:"Bearer "+e.REVIEW_TOKEN,Accept:"application/vnd.github+json"};
            const root="https://api.github.com/repos/kaokshi/zen-editorial-review";
            const meta=await json(root,headers);
            if(meta.private!==true||meta.full_name!=="kaokshi/zen-editorial-review")return false;
            const rows=await json(root+"/contents/zen-core/v1?ref=main",headers);
            return Array.isArray(rows)&&rows.some(r=>r.name==="ledger.sqlite"&&r.type==="file"&&r.size>0);
          });
          const router=await probe("ROUTERAI_CREDITS_READ",async()=>{
            if(!checks.ROUTERAI_API_KEY)return false;
            const d=await json("https://routerai.ru/api/v1/credits",{Authorization:"Bearer "+e.ROUTER_TOKEN});
            const n=d.data?.credits??d.data?.total_credits;
            return n!==null&&n!==undefined&&n!==""&&Number.isFinite(Number(n))&&Number(n)>=0;
          });
          status("PREFLIGHT_CREDENTIALS_READY",Object.values(checks).every(Boolean)&&cf&&telegram&&hook&&review&&router);
          console.log("NO_DEPLOYMENT_NO_PAID_REQUEST_NO_PUBLICATION");
          JS

# Recheck protected configuration after owner added intake secret.
