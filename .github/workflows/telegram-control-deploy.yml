name: ZEN CONTROL v0.6 Qwen chat
on:
  push:
    branches: [feature/telegram-control-mvp]
    paths: ['.github/workflows/telegram-control-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-control-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/telegram-control-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-control
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline authorization tests
        run: node --test worker.test.mjs
      - name: Deploy read-only bot and register webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          EDITORIAL_REVIEW_READ_TOKEN: ${{ secrets.EDITORIAL_REVIEW_READ_TOKEN }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: node deploy.mjs
