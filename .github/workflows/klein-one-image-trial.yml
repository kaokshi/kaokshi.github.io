name: One image Klein refinement and cinematic polish
on:
  push:
    branches:
      - feature/editorial-cloudflare-free-image
    paths:
      - .github/workflows/klein-one-image-trial.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEN_CLOUDFLARE_FREE_PLAN_CONFIRMED: "true"
      ZEN_IMAGE_ALLOW_PAID: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore the ORIGINAL Cloudflare image from earlier experiment
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-scenes-2-and-3
          run-id: 44900806627
          github-token: ${{ github.token }}
          path: input
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless numpy requests
      - name: FLUX.2 Klein 4B and OpenCV plus Pillow
        run: python src/editorial_klein_trial.py --input input/cloudflare-scene-2.jpg --output-dir output
      - name: Save 3 images for private before/after comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klein-one-image-before-after
          path: output/*.jpg
          retention-days: 2
          if-no-files-found: error
