name: ZEN mobile UI offline checks
on:
  push:
    branches: [assistant/zen-mobile-chat-ui]
    paths: ['telegram-control/**', '.github/workflows/zen-mobile-ui-checks.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test telegram-control/*.test.mjs
