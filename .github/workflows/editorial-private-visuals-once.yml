name: Private Klein and film frame pack once
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-private-visuals-once.yml
permissions:
  contents: read
concurrency:
  group: private-editorial-owner-visuals
  cancel-in-progress: false
jobs:
  private-visuals:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EDITORIAL_CF_FREE_ONLY: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication freeze and account prerequisites
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          site=json.loads(Path('config/site.json').read_text())
          assert site['publication_enabled'] is False
          for key in ('CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'EDITORIAL_PRIVATE_TOKEN'):
              if not os.environ.get(key):
                  raise SystemExit('private_visuals_missing_'+key)
          print('Private only: publication disabled, eight movie frames + eight Klein requests maximum')
          PY
      - name: Install image validation dependencies
        run: python -m pip install 'Pillow>=11,<13'
      - name: Retrieve eight real stills in approved private repository
        timeout-minutes: 8
        run: |
          umask 077
          python -m src.editorial_private_visuals cinema --date "$(TZ=Europe/Moscow date +%F)"
      - name: Generate eight original Klein images for saved mystical draft
        timeout-minutes: 24
        run: |
          umask 077
          python -m src.editorial_private_visuals legends --date "$(TZ=Europe/Moscow date +%F)"
      - name: Confirm that GitHub Pages publication remains off
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('config/site.json').read_text())['publication_enabled'] is False
          print('No public RSS updates or Dzen publications were permitted.')
          PY
