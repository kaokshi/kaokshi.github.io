name: Visual matching model research (CPU, no publishing)
# Rerun after broadening discovery terms and adding candidate availability guards.
on:
  push:
    branches: [experiment/editorial-image-rerank-20261123]
    paths: [.github/workflows/editorial-image-models-benchmark.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free CPU model dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2' 'transformers==5.24.0' 'sentencepiece>=0.2'
      - name: Technical comparison on Wikimedia images
        timeout-minutes: 56
        run: python -m research.editorial_image_models_benchmark
      - name: Upload ONLY source URLs and measurements, not image assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-models-weak-label-trial
          path: image-benchmark/proxy-results.json
          if-no-files-found: warn
          retention-days: 7
