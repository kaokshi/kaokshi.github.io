name: Zen Groq Cloudflare OpenRouter resilient live test
on:
  pull_request:
    paths:
      - 'research/zen_resilient_three_provider.py'
      - '.github/workflows/zen-resilient-three-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile research/zen_resilient_three_provider.py
      - name: Call Groq then Cloudflare then OpenRouter free fallback, never Gemini
        run: python research/zen_resilient_three_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-three-provider-safe-status
          path: ${{ runner.temp }}/zen-resilient-3provider.json
          retention-days: 7
          if-no-files-found: warn
