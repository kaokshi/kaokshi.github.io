name: Claudy Opus final audit stage one
on:
  push:
    branches: [assistant/zen-final-opus-audit]
    paths: ['.github/workflows/claudy-final-audit.yml']
permissions:
  contents: read
concurrency:
  group: claudy-opus-ui-review
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/claudy_final_audit.py
      - name: Independent static audit of public source
        env:
          CLAUDY_OPUS_API_KEY: ${{ secrets.CLAUDY_OPUS_API_KEY }}
        run: python3 -u scripts/claudy_final_audit.py
