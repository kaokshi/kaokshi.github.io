name: Opus developer design session
on:
  push:
    branches: [development/opus-5-5]
    paths: ['.github/workflows/opus-design.yml']
permissions:
  contents: read
concurrency:
  group: opus-developer
  cancel-in-progress: false
jobs:
  develop:
    if: github.run_attempt == 1 && github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: First bounded development session
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPUS_ROUTERAI_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: https://routerai.ru/api
          ANTHROPIC_DEFAULT_OPUS_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-opus-5.5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_EFFORT_LEVEL: medium
        run: |
          test -n "$ANTHROPIC_AUTH_TOKEN" || { echo "::error::developer_key_missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/opus-report"
          claude --version
          claude -p "Read docs/OPUS_TASK.md and docs/OPUS_HANDOVER.md. Session 5: design only. Owner wants more polished, stylish, enjoyable ZEN CONTROL and ZEN CORE, mobile and desktop, reports and DOCX formatting. Inspect actual UI and preserve all behavior, accessibility, budget controls and mandatory article structure. Save docs/OPUS_DESIGN.md first with design options, concrete file-level changes, before/after descriptions, responsive and accessibility acceptance criteria; then prepare isolated candidate UI changes if possible. Owner must approve design before integration. Do not create article content. Save checkpoints and final handover. Use only Read Glob Grep Edit Write. No commands, secrets, private data, workflows, publishing or production model changes. Tests not run must be pending. Return concise Russian report." --model anthropic/claude-opus-5.5 --effort medium --max-turns 30 --max-budget-usd 2 --allowedTools "Read,Glob,Grep,Edit,Write" --disallowedTools "Bash,WebFetch,WebSearch,Task,Agent" --output-format json > "$RUNNER_TEMP/opus-report/session.json"
      - name: Preserve changes even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/opus-report"
          git diff --binary HEAD > "$RUNNER_TEMP/opus-report/tracked.patch"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' f; do
            case "$f" in src/*|tests/*|docs/*) git diff --no-index --binary /dev/null "$f" >> "$RUNNER_TEMP/opus-report/new-files.patch" || test "$?" = 1 ;; esac
          done
          git status --short > "$RUNNER_TEMP/opus-report/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-design
          path: ${{ runner.temp }}/opus-report/
          retention-days: 7
