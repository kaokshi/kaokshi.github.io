name: Private ZEN Metrika audit
on:
  push:
    branches: [assistant/zen-control-statistics-20261124]
    paths: ['.github/workflows/metrika-private-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect aggregate statistics and URL evidence privately
        env:
          METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,base64,datetime
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def req(base,path,token,params=None,body=None,scheme="OAuth"):
              url=base+path
              if params: url+="?"+urllib.parse.urlencode(params)
              headers={"Authorization":scheme+" "+token,"Accept":"application/json","User-Agent":"ZEN-Analytics-Audit/1.0","Content-Type":"application/json"}
              try:
                  with opener.open(urllib.request.Request(url,headers=headers,data=json.dumps(body).encode() if body is not None else None,method="PUT" if body is not None else "GET"),timeout=20) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,None
              except Exception: return 0,None
          mt=os.environ.get("METRIKA_TOKEN",""); pt=os.environ.get("PRIVATE_TOKEN","")
          if not mt or not pt: raise SystemExit("SECRET_MISSING")
          gh="https://api.github.com"; root="/repos/kaokshi/zen-editorial-review"
          status,meta=req(gh,root,pt,scheme="Bearer")
          if status!=200 or not meta or meta.get("private") is not True: raise SystemExit("PRIVATE_STORAGE_NOT_VERIFIED")
          base="https://api-metrika.yandex.net"
          targets={"cinema":114654979,"science":114655465,"legends":114655507}
          audit={"collected_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"channels":{}}
          for channel,cid in targets.items():
              status,data=req(base,"/management/v1/counter/"+str(cid),mt)
              c=(data or {}).get("counter",{})
              entry={"id":cid,"counter_http":status,"name":c.get("name"),"site":c.get("site"),"mirrors":c.get("mirrors"),"reports":{}}
              audit["channels"][channel]=entry
              for period in (7,30):
                  p={"ids":cid,"date1":str(period)+"daysAgo","date2":"today","accuracy":"full"}
                  for label,metrics,dim in [
                    ("totals","ym:s:visits,ym:s:users,ym:s:pageviews,ym:s:bounceRate,ym:s:pageDepth,ym:s:avgVisitDurationSeconds",None),
                    ("daily","ym:s:visits,ym:s:users,ym:s:pageviews","ym:s:date"),
                    ("sources","ym:s:visits","ym:s:lastTrafficSource"),
                    ("hosts","ym:pv:pageviews","ym:pv:URLDomain"),
                    ("pages","ym:pv:pageviews","ym:pv:URL")]:
                      args={**p,"metrics":metrics,"limit":100}
                      if dim: args["dimensions"]=dim
                      code,report=req(base,"/stat/v1/data",mt,args)
                      out={"http":code,"metrics":metrics,"dimension":dim}
                      if isinstance(report,dict):
                          out["totals"]=report.get("totals")
                          out["sampled"]=report.get("sampled")
                          out["total_rows"]=report.get("total_rows")
                          if dim:
                              rows=[]
                              for row in report.get("data",[]):
                                  names=[str(x.get("name","")) for x in row.get("dimensions",[])]
                                  if label=="pages":
                                      names=[urllib.parse.urlsplit(n).scheme+"://"+str(urllib.parse.urlsplit(n).hostname or "")+urllib.parse.urlsplit(n).path if n.startswith(("https://","http://")) else "" for n in names]
                                  rows.append({"labels":names,"metrics":row.get("metrics")})
                              out["rows"]=rows
                      entry["reports"][str(period)+":"+label]=out
              print(channel.upper()+"_AUDIT_COLLECTED")
          path=root+"/contents/zen-analytics/audit-20261124.json"
          code,old=req(gh,path,pt,scheme="Bearer")
          if code not in (200,404): raise SystemExit("PRIVATE_STORAGE_READ_FAILED")
          body={"message":"Store private aggregate Metrika audit","content":base64.b64encode(json.dumps(audit,ensure_ascii=False).encode()).decode(),"branch":meta["default_branch"]}
          if code==200: body["sha"]=old["sha"]
          code,_=req(gh,path,pt,body=body,scheme="Bearer")
          if code not in (200,201): raise SystemExit("PRIVATE_STORAGE_WRITE_FAILED_"+str(code))
          print("PRIVATE_AUDIT_SAVED")
          PY
