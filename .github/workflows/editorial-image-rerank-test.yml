name: Editorial image rerank isolated test
on:
  push:
    branches: [experiment/editorial-image-rerank-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small test dependencies only
        run: python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2'
      - name: Regression tests for scene-first image selection
        run: python -m unittest -v tests.test_editorial_image_reranking
