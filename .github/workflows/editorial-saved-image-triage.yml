name: Reaudit saved images without generation
on:
  push:
    branches: [assistant/kilo-modelscope-openrouter-isolated-20261123]
    paths:
      - .github/workflows/editorial-saved-image-triage.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-private-offline-reviews
  cancel-in-progress: false
jobs:
  image-audit:
    if: github.repository == 'kaokshi/kaokshi.github.io' && github.ref_name == 'assistant/kilo-modelscope-openrouter-isolated-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local CPU vision dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1
          python -m pip install transformers==4.57.3 ImageHash==4.3.2 'Pillow>=11,<13' markdown-it-py python-docx num2words
      - name: Verify staged choices and remaining grounded alternatives
        env:
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: |
          umask 077
          python -m src.editorial_saved_image_triage
