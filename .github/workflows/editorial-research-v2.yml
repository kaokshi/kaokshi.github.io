name: Train expanded three-genre ensemble (research only)
on:
  push:
    branches: [main]
    paths:
      - 'src/editorial_research_v2.py'
      - 'src/editorial_cinema_pairs_augmented.py'
      - 'src/editorial_cinema_pairs_augmented.py'
      - '.github/workflows/editorial-research-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-research-v2
  cancel-in-progress: true
jobs:
  genre-training:
    strategy:
      fail-fast: false
      matrix:
        genre: [legends, science, cinema]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install editorial models and reader
        run: |
          python -m pip install -r requirements-editorial.txt "datasets==3.6.0"
          aiw-ru models install modernbert lightgbm
      - name: Install model for controlled Russian film-text generation
        if: matrix.genre == 'cinema'
        run: |
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.44.2" "huggingface_hub==0.26.5"
      - name: Install pinned ruBERT
        run: |
          git clone --quiet https://github.com/k1y0miiii/ru-ai-text-detector.git .rubert-upstream
          git -C .rubert-upstream checkout --quiet 244e955427548f5856bb389cc8611f959911290c
          python -m venv .rubert-venv
          .rubert-venv/bin/python -m pip install --upgrade pip
          .rubert-venv/bin/python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          .rubert-venv/bin/python -m pip install "transformers==4.44.2" "scikit-learn==1.5.2" "numpy==1.26.4" "joblib==1.4.2" "huggingface_hub==0.26.5"
      - name: Download pinned ruBERT calibration and weights
        run: |
          .rubert-venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "k1y0mi/ru-ai-text-detector",
              repo_type="model",
              revision="175e75ec79e9471f3f5b4ab0da9b859188446807",
              allow_patterns=["v4_model/*", "v4_calibrator.joblib", "threshold_v4.json"],
              local_dir=".rubert-upstream/models",
          )
          PY
      - name: Train larger genre ensemble and inspect independent holdout
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python src/editorial_research_v2.py --genre "${{ matrix.genre }}" --out editorial-training-v2
      - name: Preserve research-only model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "genre-${{ matrix.genre }}-research-v2"
          path: |
            editorial-training-v2/*-research-model.json
            editorial-training-v2/*-research-summary.json
          if-no-files-found: warn
          retention-days: 30
