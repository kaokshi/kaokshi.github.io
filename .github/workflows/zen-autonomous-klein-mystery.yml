name: Zen autonomous Klein real mystery article pilot
on:
  pull_request:
    paths:
      - 'research/zen_autonomous_klein_mystery.py'
      - '.github/workflows/zen-autonomous-klein-mystery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install existing local AI tools and documents support
        run: |
          python -m pip install -r requirements-editorial.txt
          python -m pip install Pillow python-docx 'cryptography>=44,<48'
          aiw-ru models install modernbert lightgbm transformer
      - name: Run Klein image preflight then fully autonomous one-article chain
        run: python research/zen_autonomous_klein_mystery.py
      - name: Upload safe provider and editorial status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-klein-autonomous-status
          path: ${{ runner.temp }}/zen-klein-real-test/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload owner-encrypted illustrated article package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-klein-autonomous-owner-encrypted
          path: ${{ runner.temp }}/zen-klein-real-test/owner-package.enc
          retention-days: 7
          if-no-files-found: ignore
