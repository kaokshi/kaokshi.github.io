# Owner confirmed rollout in the project conversation, 2026-11-24 16:15 UTC.
# One-shot pinned release. No repeat on later commits or reruns. Main untouched.
name: ZEN CONTROL 1.0 RC1 approved rollout
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-v1-approved-rollout.yml']
permissions:
  contents: read
concurrency:
  group: telegram-control-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/integration/zen-core-routerai-20261124' && github.event.before == '0f7c368f999ca0f8a829517845ce8045ed852495' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f7c368f999ca0f8a829517845ce8045ed852495
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned candidate offline
        run: node --test ./*.test.mjs
      - name: Upgrade existing Worker only and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          EDITORIAL_REVIEW_READ_TOKEN: ${{ secrets.EDITORIAL_REVIEW_READ_TOKEN }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          ZEN_CONTROL_EXPECTED_PREVIOUS_VERSION: '70b81b67-5c08-4581-be64-3028771be5ef'
          ZEN_CONTROL_PREFLIGHT_ONLY: 'false'
          ZEN_CONTROL_CONFIRM_UPDATE: 'true'
        run: node deploy.mjs
