name: Integrated three-model metro feedback (real CPU images)
on:
  push:
    branches: [experiment/editorial-image-strict-20261123]
    paths: [.github/workflows/metro-integrated-feedback.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      EDITORIAL_OBJECT_DETECTION_EXPERIMENT: 'true'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original and two Klein regeneration outputs
        run: |
          mkdir -p metro-count-input/original metro-count-input/new source-download
          gh run download 45027517283 --repo "${{ github.repository }}" -n zen-mystery-owner-readable -D source-download
          unzip -o source-download/owner-review-readable.zip -d metro-count-input/original
          gh run download 45054918042 --repo "${{ github.repository }}" -n metro-klein-real-corrected-images -D metro-count-input/new
      - name: Install CPU models
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'Pillow==11.3.0' 'ImageHash==4.3.2' 'transformers==5.24.0' 'timm>=1.0,<2' 'sentencepiece>=0.2'
      - name: Run actual three-model observation and repaired scene prompt
        timeout-minutes: 38
        run: python -m research.metro_strict_feedback_trial
      - name: Store read-only integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-strict-visual-evidence
          path: metro-complete-review/
          retention-days: 7
          if-no-files-found: warn
