name: Editorial and storage regression
on:
  pull_request:
    paths:
      - '.github/workflows/editorial-regression.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'telegram-control/**'
      - 'requirements-*.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-quality.txt 'python-docx==1.2.0' 'cryptography>=44,<48'
      - run: python -m unittest discover -s tests -v
      - name: Seal synthetic recovery fixture
        run: PYTHONPATH=. python tests/test_editorial_storage.py seal "$RUNNER_TEMP/editorial-storage-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-storage-fixture
          path: ${{ runner.temp }}/editorial-storage-fixture/
          if-no-files-found: error
          retention-days: 1
  restore:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 'python-docx==1.2.0' 'cryptography>=44,<48'
      - uses: actions/download-artifact@v4
        with:
          name: editorial-storage-fixture
          path: ${{ runner.temp }}/editorial-storage-fixture
      - name: Verify and open the fixture on a fresh runner
        run: PYTHONPATH=. python tests/test_editorial_storage.py restore "$RUNNER_TEMP/editorial-storage-fixture"
