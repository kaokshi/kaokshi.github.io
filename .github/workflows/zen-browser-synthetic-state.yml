name: ZEN Browser close verification offline
on:
  push:
    branches: [development/zen-analytics-foundation-20261126]
    paths: ['.github/workflows/zen-browser-synthetic-state.yml']
permissions:
  contents: read
concurrency:
  group: zen-browser-account-exclusive
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'kaokshi/kaokshi.github.io' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate closure contract without browser allocation
        run: |
          node --check scripts/zen_browser_synthetic_state.cjs
          node --test scripts/zen_browser_close.test.cjs
