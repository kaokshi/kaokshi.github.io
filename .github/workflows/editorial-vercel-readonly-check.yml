name: Zen Vercel AI Gateway read-only check
on:
  pull_request:
    paths:
      - 'research/diagnose_vercel_ai_gateway.py'
      - 'tests/test_diagnose_vercel_ai_gateway.py'
      - '.github/workflows/editorial-vercel-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-vercel-readonly-check
  cancel-in-progress: true
jobs:
  diagnose-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no-network safety and schema
        run: python -m unittest discover -s tests -p test_diagnose_vercel_ai_gateway.py -v
      - name: Verify Vercel model catalog access without generating
        run: python research/diagnose_vercel_ai_gateway.py
