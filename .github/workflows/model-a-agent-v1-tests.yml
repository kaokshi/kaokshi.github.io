name: Model A and editorial agent v1 tests
on:
  pull_request:
    paths:
      - 'src/editorial_ai_check.py'
      - 'src/editorial_agent_v1.py'
      - 'src/editorial_writer.py'
      - 'src/editorial_length.py'
      - 'src/editorial_local_llm.py'
      - 'src/editorial_semantic.py'
      - 'src/editorial_factcheck.py'
      - 'src/editorial_research.py'
      - 'src/editorial_revision*.py'
      - 'src/editorial_pipeline.py'
      - 'src/editorial_learning.py'
      - 'tests/test_editorial_pipeline.py'
      - 'tests/test_editorial_llm_http.py'
      - 'src/editorial_two_channel_pilot.py'
      - 'tests/test_editorial_two_channel_pilot.py'
      - 'src/editorial_owner_packet.py'
      - 'tests/test_editorial_owner_packet.py'
      - 'src/editorial_commons_images.py'
      - 'tests/test_editorial_commons_images.py'
      - 'src/editorial_nine_draft_queue.py'
      - 'tests/test_editorial_nine_draft_queue.py'
      - 'src/editorial_daily_topic_plan.py'
      - 'tests/test_editorial_daily_topic_plan.py'
      - 'src/editorial_daily_owner_packet.py'
      - 'tests/test_editorial_daily_owner_packet.py'
      - 'tests/test_editorial_qwen_writer_recovery.py'
      - 'research/real_nine_qwen_e2e.py'
      - 'tests/test_real_nine_qwen_e2e.py'
      - 'src/editorial_encrypted_review.py'
      - 'tests/test_editorial_encrypted_review.py'
      - 'src/editorial_request_review.py'
      - 'tests/test_editorial_request_review.py'
      - 'tests/test_model_a_85_trend.py'
      - 'src/editorial_auto_route.py'
      - 'src/editorial_auto_release.py'
      - 'src/build.py'
      - 'tests/test_editorial_agent_v1.py'
      - 'tests/test_editorial_ai_check.py'
      - 'tests/test_editorial_auto_route.py'
      - 'tests/test_editorial_auto_release.py'
      - 'tests/test_build.py'
      - 'config/ai_revision_policy.json'
      - '.github/workflows/model-a-agent-v1-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private artifact crypto library for offline tests
        run: python -m pip install 'cryptography>=44,<48'
      - name: Regression suite for model A and agent
        run: |
          python -m unittest             tests.test_editorial_agent_v1             tests.test_editorial_pipeline             tests.test_editorial_llm_http             tests.test_editorial_two_channel_pilot             tests.test_editorial_owner_packet             tests.test_editorial_commons_images             tests.test_editorial_nine_draft_queue             tests.test_editorial_daily_topic_plan             tests.test_editorial_daily_owner_packet             tests.test_editorial_qwen_writer_recovery             tests.test_real_nine_qwen_e2e             tests.test_editorial_encrypted_review             tests.test_editorial_request_review             tests.test_model_a_85_trend             tests.test_editorial_ai_check             tests.test_editorial_auto_route             tests.test_editorial_auto_release             tests.test_editorial_ai_revision_policy             tests.test_build -v
      - name: Smoke-test two-channel status-only CLI without a model
        run: |
          python src/editorial_two_channel_pilot.py \
            --legends-topic "Тестовый ключ не публиковать" \
            --science-topic "Тестовый научный ключ не публиковать" \
            --workspace "$RUNNER_TEMP/zen-editorial-private" --status-only
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"zen-editorial-private"/"two-channel-pilot-status.json"
          result=json.loads(p.read_text())
          assert len(result["channels"])==2
          assert all(x["status"]=="not_created" and not x["article_ready_for_owner"] for x in result["channels"])
          assert not result["publication_authorized"] and not result["rss_authorized"]
          assert result["delivery_status"]=="not_connected"
          print("Status only: no invented articles, no model, no release")
          PY
      - name: Verify publication flag is not changed
        run: |
          python - <<'PY'
          import json
          a=json.load(open("config/site.json"))
          b=json.load(open("config/ai_revision_policy.json"))
          assert a["publication_enabled"] is False
          assert b["publication_authorized"] is False
          assert b["paused_channels"]==[]
          assert b["current_channels"]==["legends","science","cinema"]
          assert b["daily_draft_targets"]["total"]==9
          print("Safe: 3-channel drafts enabled; no automatic publication")
          PY
  real-pilot:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install free local text models
        run: |
          python -m pip install -r requirements-editorial.txt
          aiw-ru models install modernbert lightgbm transformer
      - name: Real two-article Model A and editorial agent pilot
        run: |
          python src/editorial_ai_check.py \
            --slug science-08-sinie-ogni-idzena \
            --slug legends-01-prohodnaya-17
          python src/editorial_agent_v1.py \
            --article content/articles/science-08-sinie-ogni-idzena.json \
            --ai-report editorial-check-reports/science-08-sinie-ogni-idzena.json
          python src/editorial_agent_v1.py \
            --article content/articles/legends-01-prohodnaya-17.json \
            --ai-report editorial-check-reports/legends-01-prohodnaya-17.json
          python - <<'PY'
          import json
          from pathlib import Path
          high=json.loads(Path("editorial-agent-routing/science-08-sinie-ogni-idzena.json").read_text())
          low=json.loads(Path("editorial-agent-routing/legends-01-prohodnaya-17.json").read_text())
          assert high["index"] is not None and high["index"]>80
          assert high["decision"]=="inspect_for_substantive_issues"
          assert low["index"] is not None and low["index"]<=80
          assert low["decision"]=="other_editorial_checks_required"
          assert not high["publication_authorized"] and not low["publication_authorized"]
          print("Validated real >80 route:",high["index"])
          print("Validated real <=80 route:",low["index"])
          PY
      - name: Archive diagnostics without article text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-a-agent-v1-real-pilot
          path: |
            editorial-check-reports/
            editorial-agent-routing/
          if-no-files-found: warn
          retention-days: 7
