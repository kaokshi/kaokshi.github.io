name: Zen two channels autonomous owner-review handoff
on:
  pull_request:
    paths:
      - 'research/zen_autonomous_klein_owner_review.py'
      - 'research/zen_autonomous_science_owner_review.py'
      - '.github/workflows/zen-owner-review-two-channels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mystery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
      ZEN_OWNER_REVIEW_EPHEMERAL: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install four approved local detectors and document packages
        run: |
          python -m pip install -r requirements-editorial.txt
          python -m pip install Pillow python-docx 'cryptography>=44,<48'
          aiw-ru models install modernbert lightgbm transformer
      - name: Execute independent Klein image generation and Groq/OpenRouter review
        run: python research/zen_autonomous_klein_owner_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-mystery-owner-readable
          path: ${{ runner.temp }}/zen-klein-real-test/owner-review-readable.zip
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-mystery-owner-status
          path: ${{ runner.temp }}/zen-klein-real-test/report.json
          if-no-files-found: warn
          retention-days: 2
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install four approved local detectors and document packages
        run: |
          python -m pip install -r requirements-editorial.txt
          python -m pip install Pillow python-docx
          aiw-ru models install modernbert lightgbm transformer
      - name: Find legal provenance NASA photos and prepare science story with owner package
        run: python research/zen_autonomous_science_owner_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-science-owner-readable
          path: ${{ runner.temp }}/zen-autonomous-complete/owner-review-readable.zip
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-science-owner-status
          path: ${{ runner.temp }}/zen-autonomous-complete/report.json
          if-no-files-found: warn
          retention-days: 2
