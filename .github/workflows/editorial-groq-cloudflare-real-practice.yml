name: Zen practical Groq and Cloudflare editorial comparison
on:
  pull_request:
    paths:
      - '.github/workflows/editorial-groq-cloudflare-real-practice.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-groq-cf-practice
  cancel-in-progress: false
jobs:
  real-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private encryption
        run: python -m pip install 'cryptography>=44,<48'
      - name: Syntax check without external API calls
        run: python -m py_compile research/groq_cloudflare_real_practice.py
      - name: Generate three-channel practice drafts with bounded free calls
        run: python research/groq_cloudflare_real_practice.py
      - name: Upload numerical reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-groq-cf-practice-metrics
          path: ${{ runner.temp }}/zen-groq-cf-practice/metrics.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload encrypted owner drafts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-groq-cf-practice-owner-encrypted
          path: ${{ runner.temp }}/zen-groq-cf-practice/owner-drafts.enc
          retention-days: 7
          if-no-files-found: ignore
