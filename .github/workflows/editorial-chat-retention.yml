name: Expire owner-approved private ChatGPT review copies
on:
  schedule:
    # Maintenance-only cleanup, NOT an article production or publication schedule.
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-review-retention:
    if: github.repository == 'kaokshi/kaokshi.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expire only live private review copies older than seven days
        run: |
          umask 077
          python -m src.editorial_chat_plaintext cleanup
