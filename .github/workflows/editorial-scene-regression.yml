name: Mandatory editorial image QA regressions
on:
  push:
    branches: [assistant/kilo-modelscope-openrouter-isolated-20261123]
    paths:
      - .github/workflows/editorial-scene-regression.yml
      - src/editorial_scene_qa.py
      - src/editorial_images.py
      - src/editorial_package.py
      - tests/test_editorial_scene_qa.py
  pull_request:
    paths:
      - .github/workflows/editorial-scene-regression.yml
      - src/editorial_scene_qa.py
      - src/editorial_images.py
      - src/editorial_package.py
      - tests/test_editorial_scene_qa.py
permissions:
  contents: read
jobs:
  visual-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-quality.txt python-docx cryptography
      - name: Verify that generation, export and handoff fail closed
        run: |
          python -m unittest -q tests.test_editorial_scene_qa tests.test_editorial_layout \
            tests.test_editorial_production tests.test_editorial_storage tests.test_editorial_chat_plaintext
