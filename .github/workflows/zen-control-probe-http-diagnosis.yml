name: ZEN CONTROL Python transport diagnosis
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-probe-http-diagnosis.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare transport and identify failing request without mutations
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -u - <<'PY'
          import os, urllib.request, urllib.error, json
          url="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]+"/workers/subdomain"
          endpoint="https://zen-editorial-control.kvasrapr.workers.dev/internal/zen-core/probe"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def check(name,request):
              try:
                  with opener.open(request,timeout=15) as r:
                      print(name+" HTTP="+str(r.status))
              except urllib.error.HTTPError as e:
                  raw=e.read(2048)
                  try:
                      d=json.loads(raw)
                      codes=[x.get("code") for x in d.get("errors",[]) if isinstance(x,dict) and isinstance(x.get("code"),int)]
                      kind="json"
                  except Exception:
                      codes=[]
                      kind="html" if b"<html" in raw.lower() else "other"
                  print(name+" HTTP="+str(e.code)+" FORMAT="+kind+" CF_CODES="+str(codes)+" CF_MITIGATED="+str(e.headers.get("cf-mitigated")=="challenge"))
          for label,ua in [("DEFAULT",None),("EXPLICIT","ZEN-Control-Executor/1.0")]:
              headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]}
              if ua: headers["User-Agent"]=ua
              check("CF_API_"+label,urllib.request.Request(url,headers=headers))
              h={"Content-Type":"application/json"}
              if ua: h["User-Agent"]=ua
              check("WORKER_"+label,urllib.request.Request(endpoint,data=b'{"run":"1-1","action":"verify"}',headers=h,method="POST"))
          PY
          node --input-type=module <<'JS'
          const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+process.env.CF_ACCOUNT+"/workers/subdomain",{headers:{Authorization:"Bearer "+process.env.CF_TOKEN},redirect:"error",signal:AbortSignal.timeout(10000)});
          console.log("CF_API_NODE HTTP="+r.status);
          const w=await fetch("https://zen-editorial-control.kvasrapr.workers.dev/internal/zen-core/probe",{method:"POST",headers:{"Content-Type":"application/json"},body:'{"run":"1-1","action":"verify"}',redirect:"error",signal:AbortSignal.timeout(10000)});
          console.log("WORKER_NODE HTTP="+w.status);
          JS
