# Owner approved the isolated bridge test in the project conversation.
# One-shot pinned release. No repeat on later commits or reruns. Main untouched.
name: ZEN CONTROL 1.0 isolated end-to-end probe
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-v1-isolated-probe.yml']
permissions:
  contents: read
concurrency:
  group: telegram-control-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/integration/zen-core-routerai-20261124' && github.event.before == 'f30011283eca6b04aee52dedb7dec1317a5c8cc0' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f30011283eca6b04aee52dedb7dec1317a5c8cc0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned candidate offline
        run: node --test *.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade existing Worker with isolated probe and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          EDITORIAL_REVIEW_READ_TOKEN: ${{ secrets.EDITORIAL_REVIEW_READ_TOKEN }}
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          ZEN_CONTROL_EXPECTED_PREVIOUS_VERSION: '4d119160-c053-4fdd-bd7f-f7bece6431c5'
          ZEN_CONTROL_PREFLIGHT_ONLY: 'false'
          ZEN_CONTROL_CONFIRM_UPDATE: 'true'
        run: node deploy.mjs
      - name: Exercise isolated Worker to executor and receipt cycle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
        run: python live_probe.py
