name: Claudy Opus mobile UI review
on:
  push:
    branches: [assistant/claudy-opus-ui-review]
    paths: ['.github/workflows/claudy-opus-ui-review.yml']
permissions:
  contents: read
concurrency:
  group: claudy-opus-ui-review
  cancel-in-progress: false
jobs:
  review:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate syntax
        run: python3 -m py_compile scripts/claudy_ui_review.py
      - name: Review public UI with designated Opus key
        env:
          CLAUDY_OPUS_API_KEY: ${{ secrets.CLAUDY_OPUS_API_KEY }}
        run: python3 -u scripts/claudy_ui_review.py
