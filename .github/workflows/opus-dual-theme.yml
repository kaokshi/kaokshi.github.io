name: Opus approved dual theme implementation
on:
  push:
    branches: [development/opus-dual-theme-20261125]
    paths: ['.github/workflows/opus-dual-theme.yml']
permissions:
  contents: read
concurrency:
  group: opus-developer
  cancel-in-progress: false
jobs:
  develop:
    if: github.run_attempt == 1 && github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: First bounded development session
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPUS_ROUTERAI_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: https://routerai.ru/api
          ANTHROPIC_DEFAULT_OPUS_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-opus-5.5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_EFFORT_LEVEL: medium
        run: |
          test -n "$ANTHROPIC_AUTH_TOKEN" || { echo "::error::developer_key_missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/opus-report"
          claude --version
          claude -p "Read AGENTS.md and docs/OPUS_DUAL_THEME_TASK.md. Implement owner-approved dual theme in existing ZEN CONTROL and ZEN CORE Telegram Mini App, not new design alternatives. Inspect telegram-control/ui.mjs and actual UI entry points. Preserve authentication, API contracts, controls, accessibility, mobile layout, finance and publication guards. Add theme selector, light and dark palettes, persisted non-sensitive theme preference with safe fallback, and focused tests. Keep changes only in telegram-control/ui.mjs, appropriate UI test files and docs/OPUS_DUAL_THEME_REPORT.md; no deployment, private data, workflow edits, secrets or production calls. Save report early. No article content. Use Read Glob Grep Edit Write only. Independent test job follows." --model anthropic/claude-opus-5.5 --effort medium --max-turns 15 --max-budget-usd 2 --allowedTools "Read,Glob,Grep,Edit,Write" --disallowedTools "Bash,WebFetch,WebSearch,Task,Agent" --output-format json > "$RUNNER_TEMP/opus-report/session.json"
      - name: Preserve changes even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/opus-report"
          git diff --binary HEAD > "$RUNNER_TEMP/opus-report/tracked.patch"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' f; do
            case "$f" in telegram-control/*.test.mjs|docs/*) git diff --no-index --binary /dev/null "$f" >> "$RUNNER_TEMP/opus-report/new-files.patch" || test "$?" = 1 ;; esac
          done
          git status --short > "$RUNNER_TEMP/opus-report/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-dual-theme
          path: ${{ runner.temp }}/opus-report/
          retention-days: 7
  verify:
    needs: develop
    if: always() && needs.develop.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opus-dual-theme
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate and run Node regression
        run: |
          if test -s "$RUNNER_TEMP/candidate/tracked.patch"; then git apply "$RUNNER_TEMP/candidate/tracked.patch"; fi
          if test -s "$RUNNER_TEMP/candidate/new-files.patch"; then git apply "$RUNNER_TEMP/candidate/new-files.patch"; fi
          node --check telegram-control/ui.mjs
          node --test telegram-control/*.test.mjs
