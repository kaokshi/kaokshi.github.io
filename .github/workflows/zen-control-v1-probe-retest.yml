name: ZEN CONTROL live bridge retest (no deployment)
on:
  push:
    branches: [integration/zen-core-routerai-20261124]
    paths: ['.github/workflows/zen-control-v1-probe-retest.yml']
permissions:
  contents: read
concurrency:
  group: telegram-control-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate transport before sending any request
        run: python -m unittest tests.test_editorial_zen_control -q
      - name: Repeat isolated live test without deploying or producing content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZEN_CORE_INTAKE_SECRET: ${{ secrets.ZEN_CORE_INTAKE_SECRET }}
        run: python -u telegram-control/live_probe.py
