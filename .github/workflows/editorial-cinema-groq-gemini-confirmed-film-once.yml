name: Cinema verified film Groq Gemini private pilot
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-cinema-groq-gemini-confirmed-film-once.yml
permissions:
  contents: read
  actions: read
jobs:
  private-cinema:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      EDITORIAL_ISOLATED_VALIDATION: 'true'
      EDITORIAL_ALT_MODELS_TEST: 'true'
      EDITORIAL_GROQ_GEMINI_KLEIN_PILOT: 'true'
      EDITORIAL_CINEMA_ONLY_SEED: 'true'
      EDITORIAL_GROQ_FREE_ONLY: 'true'
      EDITORIAL_TEST_FREE_ONLY: 'true'
      EDITORIAL_CF_FREE_ONLY: 'true'
      EDITORIAL_GEMINI_RPM: '2'
      EDITORIAL_GEMINI_DAILY_CALLS: '2'
      EDITORIAL_GROQ_FALLBACK_ONLY: 'false'
      EDITORIAL_OVH_ONE_ARTICLE: 'false'
      EDITORIAL_GROQ_OVH_KLEIN_PILOT: 'false'
      EDITORIAL_TEST_WITHOUT_OPENROUTER: 'false'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_AI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDITORIAL_STATE_KEY_HEX: ${{ secrets.EDITORIAL_STATE_KEY_HEX }}
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication freeze, selected model and quotas
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          from src.editorial_brain import cycle_settings
          from src.editorial_providers import gemini_model
          site=json.loads(Path("config/site.json").read_text())
          assert site["publication_enabled"] is False
          assert gemini_model() == "gemini-3.5-flash"
          cfg=cycle_settings("daily", 120, True, validate_cinema=True)
          assert cfg["articles_per_channel"] == {"cinema": 1}
          assert cfg["daily_calls"]["groq"] == 2
          assert cfg["daily_calls"]["gemini"] == 2
          assert cfg["daily_calls"]["ovh"] == 0 and cfg["daily_calls"]["openrouter"] == 0
          required=("GROQ_API_KEY","GEMINI_API_KEY","EDITORIAL_PRIVATE_TOKEN",
                    "EDITORIAL_STATE_KEY_HEX","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN")
          missing=[x for x in required if not os.environ.get(x)]
          if missing: raise SystemExit("missing_pilot_secrets:"+",".join(missing))
          cfg_full=json.loads(Path("config/editorial_production.json").read_text())
          with open(os.environ["GITHUB_ENV"],"a") as stream:
              stream.write("EDITORIAL_REVIEW_PUBLIC_KEY="+cfg_full["schedule"]["owner_public_key"]+"\n")
              stream.write("EDITORIAL_STATE_DIR="+os.environ["RUNNER_TEMP"]+"/cinema-confirmed-seed\n")
              stream.write("EDITORIAL_SEALED_DIR="+os.environ["RUNNER_TEMP"]+"/cinema-confirmed-sealed\n")
          print(json.dumps({"selected_film":"Prisoners (2013)","model":gemini_model(),
                            "limits":{"groq":2,"gemini":2},"publication_authorized":False}))
          PY
      - name: Install encrypted storage and editorial QA dependencies
        run: |
          python -m pip install 'cryptography>=44,<48'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install -r requirements-production.txt
          aiw-ru models install modernbert lightgbm transformer || echo "::warning::QA detectors unavailable; incomplete QA must stay blocked"
      - name: Generate one film article from independently verified sources
        id: generate
        timeout-minutes: 120
        env:
          EDITORIAL_PRIVATE_TOKEN: ''
          EDITORIAL_PRIVATE_REPOSITORY: ''
        run: |
          umask 077
          day="$(TZ=Europe/Moscow date +%F)"
          echo "$day" > "$RUNNER_TEMP/editorial-day"
          python -m src.editorial_brain daily --date "$day" \
            --encrypted-mode --validate-cinema --validation-window 120 \
            --local-state "$EDITORIAL_STATE_DIR"
      - name: Deliver completed OR clearly incomplete film draft only to authorized PRIVATE review
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/editorial-day" ] && [ -d "$EDITORIAL_STATE_DIR" ]; then
            day="$(cat "$RUNNER_TEMP/editorial-day")"
            python -m src.editorial_chat_plaintext publish --root "$EDITORIAL_STATE_DIR" --date "$day"
          fi
      - name: Post sanitized status to private issue
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/editorial-day" ] && [ -f "$EDITORIAL_STATE_DIR/$(cat "$RUNNER_TEMP/editorial-day")/state.json" ]; then
            python -m src.editorial_chat_bridge --root "$EDITORIAL_STATE_DIR" --date "$(cat "$RUNNER_TEMP/editorial-day")"
          fi
      - name: Encrypt all original partial state for recovery
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/editorial-day" ] && [ -d "$EDITORIAL_STATE_DIR" ]; then
            python -m src.editorial_delivery seal --root "$EDITORIAL_STATE_DIR" \
              --date "$(cat "$RUNNER_TEMP/editorial-day")" --output "$EDITORIAL_SEALED_DIR"
          fi
      - name: Store only encrypted checkpoints in public Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-prisoners-groq-gemini35-encrypted
          path: |
            ${{ env.EDITORIAL_SEALED_DIR }}/checkpoint.enc
            ${{ env.EDITORIAL_SEALED_DIR }}/owner-review.enc
          if-no-files-found: warn
          retention-days: 14
