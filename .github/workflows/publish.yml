name: Publish editorial website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'config/**'
      - 'site/**'
      - '.github/workflows/publish.yml'
      - 'tests/**'
  schedule:
    - cron: '10 5,11,17,23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit editorial drafts (no publishing)
        run: python src/audit.py
      - name: Quality audit across all channels (read-only)
        run: python src/editorial_quality.py
      - name: Run basic tests
        run: python -m unittest discover -s tests -v
      - name: Build static site and RSS
        run: python src/build.py
      - name: Verify RSS XML across all three channels
        run: python src/rss_verify.py
      - name: Respect global publication freeze
        id: release
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path("config/site.json").read_text(encoding="utf-8"))
          print("enabled=" + ("true" if d.get("publication_enabled") is True else "false"))
          PY
      - name: Configure GitHub Pages
        if: steps.release.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: steps.release.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to GitHub Pages
        if: steps.release.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
