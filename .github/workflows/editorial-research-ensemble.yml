name: EXPERIMENT - research ensemble from published Russian corpus labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-research-ensemble.yml'
      - 'src/editorial_research_train.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-four-detector-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-editorial.txt
      - name: Install free open-source text tools
        run: python -m pip install -r requirements-editorial.txt
      - name: Download published open models to runner cache
        run: |
          aiw-ru models install modernbert lightgbm
      - name: Install pinned ruBERT v4 in isolated environment
        run: |
          git clone --quiet https://github.com/k1y0miiii/ru-ai-text-detector.git .rubert-upstream
          git -C .rubert-upstream checkout --quiet 244e955427548f5856bb389cc8611f959911290c
          python -m venv .rubert-venv
          .rubert-venv/bin/python -m pip install --upgrade pip
          .rubert-venv/bin/python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          .rubert-venv/bin/python -m pip install "transformers==4.44.2" "scikit-learn==1.5.2" "numpy==1.26.4" "joblib==1.4.2" "huggingface_hub==0.26.5"
      - name: Download pinned ruBERT v4 calibration and weights
        run: |
          .rubert-venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "k1y0mi/ru-ai-text-detector",
              repo_type="model",
              revision="175e75ec79e9471f3f5b4ab0da9b859188446807",
              allow_patterns=["v4_model/*", "v4_calibrator.joblib", "threshold_v4.json"],
              local_dir=".rubert-upstream/models",
          )
          PY
      - name: Run publisher-labelled research with all four existing detectors
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python src/editorial_research_train.py --out editorial-ensemble-research
      - name: Print research results and explicit non-production status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("editorial-ensemble-research/research_summary.json")
          if p.exists():
              d=json.loads(p.read_text(encoding="utf-8"))
              print("RESEARCH_RESULTS",json.dumps(d,ensure_ascii=False))
          else:
              print("RESEARCH_INCOMPLETE: no training summary; no score can be claimed")
          print("PUBLICATION_AUTHORIZED=false")
          PY
      - name: Store aggregate research reports ONLY (no source texts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-detector-research-only
          path: |
            editorial-ensemble-research/*-RESEARCH-ONLY.json
            editorial-ensemble-research/research_summary.json
          retention-days: 14
          if-no-files-found: warn
