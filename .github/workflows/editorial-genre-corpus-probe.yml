name: Probe genre-matched Russian corpora (research only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/editorial_genre_corpus_probe.py'
      - '.github/workflows/editorial-genre-corpus-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned data reader
        run: python -m pip install "datasets==3.6.0" "huggingface_hub==0.26.5"
      - name: Measure candidate texts and authorship provenance (without saving texts)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python src/editorial_genre_corpus_probe.py
      - name: Preserve aggregate counts and candidate hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genre-longform-corpus-readiness
          path: editorial-genre-probe/report.json
          if-no-files-found: warn
          retention-days: 30
