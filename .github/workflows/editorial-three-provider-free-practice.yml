name: Zen three-provider free editorial chain practice
on:
  pull_request:
    paths:
      - 'research/compare_openrouter_editorial_chains.py'
      - '.github/workflows/editorial-three-provider-free-practice.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zen-three-provider-free-practice
  cancel-in-progress: false
jobs:
  three-provider-free-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZEN_REVIEW_PUBLIC_KEY_HEX: c4a92b34baaf877160714955f32ea81021f066d63e6c1ae1587323c2e8a0d561
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install owner-only archive encryption
        run: python -m pip install 'cryptography>=44,<48'
      - name: Syntax check before external calls
        run: python -m py_compile research/compare_openrouter_editorial_chains.py
      - name: Validate free-price models then run bounded multi-model editorial pilot
        run: python research/compare_openrouter_editorial_chains.py
      - name: Upload numerical metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-three-provider-free-editorial-metrics
          path: ${{ runner.temp }}/zen-3provider-free-pilot/metrics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload owner-encrypted article drafts and reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-three-provider-free-owner-encrypted
          path: ${{ runner.temp }}/zen-3provider-free-pilot/owner-drafts-and-critiques.enc
          if-no-files-found: ignore
          retention-days: 7
