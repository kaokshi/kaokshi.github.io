name: Opus Codex handover audit
on:
  push:
    branches: [development/opus-codex-handover-20261125]
    paths: ['.github/workflows/opus-codex-handover.yml']
permissions:
  contents: read
concurrency:
  group: opus-developer
  cancel-in-progress: false
jobs:
  develop:
    if: github.run_attempt == 1 && github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: First bounded development session
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPUS_ROUTERAI_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: https://routerai.ru/api
          ANTHROPIC_DEFAULT_OPUS_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-opus-5.5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_EFFORT_LEVEL: medium
        run: |
          test -n "$ANTHROPIC_AUTH_TOKEN" || { echo "::error::developer_key_missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/opus-report"
          claude --version
          claude -p "Read AGENTS.md and docs/OPUS_CODEX_HANDOVER.md. Audit actual current main snapshot after Codex PRs 99 through 104. Focus on reproducible remaining defects in six-article recovery, licensed photo retrieval, cinema source and duplicate selection, cave/asteroid diagram semantic QA, checkpoint reuse, finance and DOCX delivery. First write findings with file/line evidence and distinguish verified code observations from live unknowns. Fix only critical reproducible issues on isolated branch and add focused offline regressions. Do not repeat previous audits, change model choices, publish, enable RSS, access private data, secrets or modify workflows. Current production run is active, never duplicate or interfere. Preserve checkpoints. No live claims. Use Read Glob Grep Edit Write only; independent offline verify job will test changes. Return concise Russian report." --model anthropic/claude-opus-5.5 --effort medium --max-turns 30 --max-budget-usd 2 --allowedTools "Read,Glob,Grep,Edit,Write" --disallowedTools "Bash,WebFetch,WebSearch,Task,Agent" --output-format json > "$RUNNER_TEMP/opus-report/session.json"
      - name: Preserve changes even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/opus-report"
          git diff --binary HEAD > "$RUNNER_TEMP/opus-report/tracked.patch"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' f; do
            case "$f" in src/*|tests/*|docs/*) git diff --no-index --binary /dev/null "$f" >> "$RUNNER_TEMP/opus-report/new-files.patch" || test "$?" = 1 ;; esac
          done
          git status --short > "$RUNNER_TEMP/opus-report/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-codex-handover
          path: ${{ runner.temp }}/opus-report/
          retention-days: 7
  verify:
    needs: develop
    if: always() && needs.develop.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opus-codex-handover
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow ImageHash
      - name: Independent offline regression
        run: |
          if test -s "$RUNNER_TEMP/candidate/tracked.patch"; then git apply "$RUNNER_TEMP/candidate/tracked.patch"; fi
          if test -s "$RUNNER_TEMP/candidate/new-files.patch"; then git apply "$RUNNER_TEMP/candidate/new-files.patch"; fi
          python -m unittest discover -s tests -q
          node --test telegram-control/*.test.mjs
