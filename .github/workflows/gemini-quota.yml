name: Gemini API access and quota visibility (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
  pull_request:
    paths:
      - '.github/workflows/gemini-quota.yml'
      - 'src/editorial_gemini_quota.py'
      - 'tests/test_editorial_gemini_quota.py'
permissions:
  contents: read
jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_editorial_gemini_quota
  read-gemini:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write  # short-lived Google Cloud Monitoring credential, no long-lived GCP key
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GOOGLE_WIF_PROVIDER: ${{ secrets.GOOGLE_WIF_PROVIDER }}
      GOOGLE_QUOTA_VIEWER_SA_EMAIL: ${{ secrets.GOOGLE_QUOTA_VIEWER_SA_EMAIL }}
      GOOGLE_QUOTA_MONITOR_PROJECT: ${{ vars.GOOGLE_QUOTA_MONITOR_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_editorial_gemini_quota
      - name: List Gemini-accessible models without inference requests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.editorial_gemini_quota --model gemini-3.5-flash-lite --output "$RUNNER_TEMP/gemini-status.json"
      - name: Obtain short-lived optional Google Monitoring Viewer identity
        id: google_auth
        if: env.GOOGLE_WIF_PROVIDER != '' && env.GOOGLE_QUOTA_VIEWER_SA_EMAIL != '' && env.GOOGLE_QUOTA_MONITOR_PROJECT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_QUOTA_VIEWER_SA_EMAIL }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/monitoring.read
      - name: Observe optional Gemini Cloud Monitoring metrics without inference
        if: always()
        env:
          GOOGLE_CLOUD_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: python -m src.editorial_gemini_cloud_usage --model gemini-3.5-flash-lite --output "$RUNNER_TEMP/gemini-cloud-metrics.json"
