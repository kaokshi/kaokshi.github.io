name: ZEN Browser Run Dzen reachability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zen-browser-dzen-probe.yml'
permissions:
  contents: read
concurrency:
  group: zen-browser-dzen-probe
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CDP client
        working-directory: ${{ runner.temp }}
        run: npm install --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.56.1
      - name: Check unauthenticated Dzen Studio reachability
        working-directory: ${{ runner.temp }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const id = process.env.CF_ACCOUNT_ID;
            const token = process.env.CF_API_TOKEN;
            if (!id || !token) {
              console.error('BROWSER_CONFIG_MISSING');
              process.exitCode = 1;
              return;
            }
            if (!/^[a-f0-9]{32}$/i.test(id)) {
              console.error('BROWSER_ACCOUNT_ID_INVALID');
              process.exitCode = 1;
              return;
            }
            let browser;
            let stage = 'CONNECT';
            try {
              browser = await chromium.connectOverCDP(
                'wss://api.cloudflare.com/client/v4/accounts/' + id + '/browser-run/devtools/browser',
                { headers: { Authorization: 'Bearer ' + token }, timeout: 15000 }
              );
              console.log('BROWSER_CONNECTED');
              stage = 'NAVIGATE';
              const context = browser.contexts()[0];
              const page = context.pages()[0] || await context.newPage();
              const response = await page.goto('https://dzen.ru/profile/editor', { waitUntil: 'domcontentloaded', timeout: 15000 });
              stage = 'ASSERT';
              const host = new URL(page.url()).hostname;
              const status = response?.status() || 0;
              const body = (await page.locator('body').innerText({timeout: 5000}).catch(() => '')).slice(0, 20000);
              const challenge = /капча|подтвердите, что вы не робот|captcha|access denied|verify you are human/i.test(body);
              const login = /(?:^|\.)passport\.yandex\.(?:ru|com)$/.test(host) || /войти|авторизац|вход в аккаунт/i.test(body);
              const knownHost = /(?:^|\.)(?:dzen\.ru|yandex\.ru|yandex\.com|ya\.ru)$/.test(host);
              console.log('DZEN_HTTP_STATUS=' + status);
              console.log('DZEN_KNOWN_HOST=' + knownHost);
              console.log('DZEN_CHALLENGE=' + challenge);
              console.log('DZEN_LOGIN_HINT=' + login);
              if (!knownHost || status >= 400 || !status || challenge) throw new Error('Dzen reachability not established');
              console.log('DZEN_REACHABLE_UNAUTHENTICATED');
            } catch (error) {
              const match = String(error?.message || '').match(/\b(401|403|404|429|500|502|503)\b/);
              console.error('BROWSER_' + stage + '_FAILED' + (match ? '_HTTP_' + match[1] : ''));
              process.exitCode = 1;
            } finally {
              if (browser) {
                try {
                  await browser.close();
                  console.log('BROWSER_CLOSED');
                } catch {
                  console.error('BROWSER_CLOSE_FAILED');
                  process.exitCode = 1;
                }
              }
            }
          })().catch(() => { console.error('BROWSER_SMOKE_FAILED'); process.exitCode = 1; });
          JS
