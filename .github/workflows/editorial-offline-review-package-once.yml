name: Build owner-private offline article bundle with all images
on:
  push:
    branches:
      - assistant/kilo-modelscope-openrouter-isolated-20261123
    paths:
      - .github/workflows/editorial-offline-review-package-once.yml
permissions:
  contents: read
concurrency:
  group: owner-private-offline-reviews
  cancel-in-progress: false
jobs:
  owner-private-review:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require private repository and publication freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          assert json.loads(Path('config/site.json').read_text())['publication_enabled'] is False
          assert os.environ.get("EDITORIAL_PRIVATE_TOKEN")
          print("Packaging only in authorized private review repository.")
          PY
      - name: Install only Markdown DOCX and image readers
        run: python -m pip install 'markdown-it-py==4.3.0' 'python-docx==1.2.0' 'pillow>=11,<13' 'ImageHash==4.3.2'
      - name: Verify section bindings and attempt to build the new offline ZIP
        run: python -m src.editorial_offline_review_pack --date 2026-11-23 --historical-repair
