name: Opus generalized recovery regression repair
on:
  push:
    branches: [development/opus-codex-handover-20261125]
    paths: ['.github/workflows/opus-general-repair.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: opus-developer
  cancel-in-progress: false
jobs:
  develop:
    if: github.run_attempt == 1 && github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opus-general-recovery
          run-id: 45700326049
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Restore previous candidate exactly
        run: |
          if test -s "$RUNNER_TEMP/previous/tracked.patch"; then git apply "$RUNNER_TEMP/previous/tracked.patch"; fi
          if test -s "$RUNNER_TEMP/previous/new-files.patch"; then git apply "$RUNNER_TEMP/previous/new-files.patch"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: First bounded development session
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPUS_ROUTERAI_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: https://routerai.ru/api
          ANTHROPIC_DEFAULT_OPUS_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-opus-5.5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_EFFORT_LEVEL: medium
        run: |
          test -n "$ANTHROPIC_AUTH_TOKEN" || { echo "::error::developer_key_missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/opus-report"
          claude --version
          claude -p "Read AGENTS.md, docs/OPUS_CODEX_HANDOVER.md and docs/OPUS_GENERAL_RECOVERY.md if present. Restore previous candidate already applied. Fix four actual regression failures from run 45700326049: render_diagram line 364 uses undefined url, both cave and asteroid tests raise NameError; groundwater-scale replacement returns None where source-bound published values require groundwater-scale; new test test_plan_rejects_an_unrenderable_schematic_before_paid_stages sees image_plan_kind_invalid rather than image_plan_template_invalid. Inspect actual schema, repair root causes and test fixture only if demonstrably wrong, never weaken old tests. Ensure source evidence is genuinely required, generalized registry works on unrelated themes, and no extra charges or publication. Focus only on these regressions, do not repeat broad audit. Save checkpoint early and concise docs/OPUS_GENERAL_REPAIR.md. No private data, production calls, secrets, workflows, publishing or RSS. Read Glob Grep Edit Write only. Independent full tests follow." --model anthropic/claude-opus-5.5 --effort medium --max-turns 20 --max-budget-usd 2 --allowedTools "Read,Glob,Grep,Edit,Write" --disallowedTools "Bash,WebFetch,WebSearch,Task,Agent" --output-format json > "$RUNNER_TEMP/opus-report/session.json"
      - name: Preserve changes even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/opus-report"
          git diff --binary HEAD > "$RUNNER_TEMP/opus-report/tracked.patch"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' f; do
            case "$f" in src/*|tests/*|docs/*) git diff --no-index --binary /dev/null "$f" >> "$RUNNER_TEMP/opus-report/new-files.patch" || test "$?" = 1 ;; esac
          done
          git status --short > "$RUNNER_TEMP/opus-report/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-general-repair
          path: ${{ runner.temp }}/opus-report/
          retention-days: 7
  verify:
    needs: develop
    if: always() && needs.develop.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opus-general-repair
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-editorial.txt Pillow ImageHash cryptography python-docx
      - name: Apply candidate and run Python regression
        run: |
          if test -s "$RUNNER_TEMP/candidate/tracked.patch"; then git apply "$RUNNER_TEMP/candidate/tracked.patch"; fi
          if test -s "$RUNNER_TEMP/candidate/new-files.patch"; then git apply "$RUNNER_TEMP/candidate/new-files.patch"; fi
          python -m unittest discover -s tests -q
      - name: Node offline regression
        if: always()
        run: node --test telegram-control/*.test.mjs
