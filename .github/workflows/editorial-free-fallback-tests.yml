name: Editorial free fallback regression
on:
  pull_request:
    paths:
      - 'src/editorial_brain.py'
      - 'src/editorial_groq_budget.py'
      - 'src/editorial_free_fallback.py'
      - '.github/workflows/editorial-production.yml'
      - 'tests/test_editorial_quota_fallback.py'
      - '.github/workflows/editorial-free-fallback-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-free-fallback:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU test dependencies
        run: python -m pip install -r requirements-quality.txt python-docx
      - name: Compile changed code
        run: python -m py_compile src/editorial_brain.py src/editorial_free_fallback.py tests/test_editorial_quota_fallback.py
      - name: Verify free fallback without API calls or publication
        run: python -m unittest -v tests.test_editorial_quota_fallback
