name: One-time private diagnosis of previous autonomous three-channel run
on:
  push:
    branches:
      - assistant/editorial-private-bridge-diagnostics-20261123
    paths:
      - .github/workflows/editorial-diagnose-previous-once.yml
permissions:
  contents: read
  actions: read
jobs:
  private-diagnosis:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EDITORIAL_STATE_KEY_HEX: ${{ secrets.EDITORIAL_STATE_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication lock and installed content-free diagnostic script
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          site = json.loads(Path("config/site.json").read_text())
          schedule = json.loads(Path("config/editorial_production.json").read_text())["schedule"]
          assert site["publication_enabled"] is False
          assert schedule["enabled"] is False and schedule["owner_approved"] is False
          assert Path("src/editorial_chat_status.py").exists()
          print("No publication; no text generation or image generation.")
          PY
      - name: Install checkpoint decryption dependency
        run: python -m pip install 'cryptography>=44,<48'
      - name: Download only encrypted checkpoint from previous agent run
        uses: actions/download-artifact@v4
        with:
          run-id: 45126126260
          name: editorial-three-agent-only-20261123
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-encrypted-test
      - name: Decrypt privately and publish ONLY safe diagnosis to GitHub private issue
        env:
          EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
        run: |
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path
          from src.editorial_delivery import restore_blob
          from src.editorial_chat_status import from_state
          from src.editorial_chat_bridge import publish_status

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "previous-encrypted-test" / "checkpoint.enc"
          if not source.is_file():
              raise SystemExit("prior_checkpoint_not_found")
          output = root / "private-prior-diagnosis"
          restore_blob(source.read_bytes(), output, "2026-11-23")
          summary = from_state(output, "2026-11-23")
          result = publish_status(summary, os.environ["EDITORIAL_PRIVATE_TOKEN"],
                                  run_id="45126126260")
          print("Archived previous run examined securely:", result["status"])
          print("Only sanitized statuses were shared; private source files remain on runner.")
          PY
