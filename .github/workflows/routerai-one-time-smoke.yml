name: One-time RouterAI Claude DeepSeek Qwen smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/routerai-one-time-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routerai-one-shot-${{ github.repository }}
  cancel-in-progress: false
jobs:
  paid-once:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read RouterAI credits and send at most 3 tiny model calls
        env:
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          ROUTERAI_TEST_RESULT: ${{ runner.temp }}/routerai-smoke.json
        run: python -m src.editorial_routerai_smoke
      - name: Save safe test evidence without API key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routerai-once-summary
          path: ${{ runner.temp }}/routerai-smoke.json
          retention-days: 7
          if-no-files-found: ignore
