name: Metrika read-only connection check
on:
  push:
    branches: [assistant/zen-control-statistics-20261124]
    paths: ['.github/workflows/metrika-connection-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify authorized counter and reports
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,sys
          token=os.environ.get("YANDEX_METRIKA_TOKEN","")
          if not token:
              print("METRIKA_TOKEN_MISSING")
              sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def get(path,params={}):
              url="https://api-metrika.yandex.net"+path
              if params: url+="?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"Authorization":"OAuth "+token,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=20) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print("METRIKA_HTTP_"+str(e.code))
                  sys.exit(1)
              except Exception:
                  print("METRIKA_CONNECTION_FAILED")
                  sys.exit(1)
          counter=get("/management/v1/counter/114654979").get("counter",{})
          if str(counter.get("id"))!="114654979":
              print("METRIKA_COUNTER_NOT_VERIFIED")
              sys.exit(1)
          print("METRIKA_COUNTER_ACCESS_CONFIRMED")
          report=get("/stat/v1/data",{"ids":"114654979","metrics":"ym:s:visits,ym:s:users,ym:s:pageviews,ym:s:avgVisitDurationSeconds","date1":"7daysAgo","date2":"yesterday","accuracy":"full"})
          if not isinstance(report.get("data"),list) or not isinstance(report.get("totals"),list) or len(report["totals"])!=4:
              print("METRIKA_REPORT_SCHEMA_NOT_VERIFIED")
              sys.exit(1)
          print("METRIKA_REPORT_ACCESS_CONFIRMED")
          print("METRIKA_TRAFFIC_PRESENT="+str(bool(report["totals"][0])).lower())
          PY
