name: Cinema content quality diagnostic
on:
  push:
    branches: [diagnostics/cinema-content-20261125]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        film: [dune, wild_robot, wing_it]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.24.0' Pillow ImageHash python-docx imageio-ffmpeg 'mcp>=1.12,<2' sentencepiece
      - name: Evaluate real pixels
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m src.cinema_content_diagnostic ${{ matrix.film }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema-quality-${{ matrix.film }}
          path: diagnostic-output/
          retention-days: 1
          if-no-files-found: warn
