name: Isolated free image generator model comparison
on:
  push:
    branches:
      - experiment/image-generators-compare-20261123
    paths:
      - .github/workflows/image-model-benchmark-once.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-cloudflare-image-benchmark-20261123
  cancel-in-progress: false
jobs:
  compare-four-image-models:
    if: github.repository == 'kaokshi/kaokshi.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDITORIAL_PRIVATE_TOKEN: ${{ secrets.EDITORIAL_PRIVATE_TOKEN }}
      EDITORIAL_CF_FREE_ONLY: 'true'
      ALLOW_PAID_MODEL_BENCHMARK: 'false'
      BENCHMARK_DIR: benchmark-out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure not the Codex working branch and publication frozen
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ.get("GITHUB_REF_NAME") == "experiment/image-generators-compare-20261123"
          site=json.loads(Path("config/site.json").read_text(encoding="utf-8"))
          assert site["publication_enabled"] is False
          for name in ("CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","EDITORIAL_PRIVATE_TOKEN"):
              if not os.environ.get(name):
                  raise SystemExit("missing_required_secret:"+name)
          print("Independent model comparison, no editorial or Codex branch writes.")
          PY
      - name: Install image decoder only
        run: python -m pip install 'Pillow>=11,<13'
      - name: Compare 4 image generators on identical tram-depot scene
        id: test
        timeout-minutes: 18
        run: |
          python -m compileall -q experiments/image_model_benchmark.py
          python -m experiments.image_model_benchmark
      - name: Save independent image samples and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-four-models-tram-depot-20261123
          path: benchmark-out/
          if-no-files-found: warn
          retention-days: 14
