# Start with Python correctness checks; formatting is optional and is NOT auto-applied.
# No article text, site content, RSS or publication configuration is modified.
target-version = "py312"
line-length = 100
exclude = [".git", ".rubert-upstream", ".rubert-venv", ".generator-venv", "editorial-*-reports", "editorial-training-v2"]

[lint]
select = ["E4", "E7", "E9", "F"]
# New findings are annotated only on lines changed in Pull Requests.
# The existing codebase is not reformatted in bulk.

[lint.per-file-ignores]
# The test modules deliberately add src/ to sys.path before importing local code.
"tests/*.py" = ["E402"]
